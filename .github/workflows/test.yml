name: Test

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    # The isolated x86 guest uses QEMU; retain the complete checks with a bounded budget.
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[test]'
      - run: pytest --cov=custom_components/matic_robot --cov-report=term-missing
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy custom_components/matic_robot
      - run: python scripts/check_public_tree.py
      - run: python -m build --sdist --wheel
      - run: python scripts/check_release_artifacts.py dist
      - run: python scripts/check_fresh_install.py dist
