name: Panel setup acceptance

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-setup:
    name: Native setup (HA ${{ matrix.ha }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        ha: ["2026.7.0", "2026.8.0", "2026.9.3"]
    env:
      HA_VERSION: ${{ matrix.ha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Install the actual Home Assistant release and runtime dependencies
        run: |
          python -m venv .compat-venv
          .compat-venv/bin/python - <<'PY'
          import os
          import json
          import subprocess
          import sys
          import tomllib
          from pathlib import Path
          dependencies = tomllib.loads(Path("pyproject.toml").read_text())["project"]["dependencies"]
          subprocess.run([sys.executable, "-m", "pip", "install", f"homeassistant=={os.environ['HA_VERSION']}", *dependencies], check=True)
          # HA 2026.7's USB dependency imports serialx's ESPHome transport before
          # ESPHome is loaded; install the version required by this HA release.
          import homeassistant
          esphome = Path(homeassistant.__file__).parent / "components/esphome/manifest.json"
          requirement = next(item for item in json.loads(esphome.read_text())["requirements"] if item.startswith("aioesphomeapi=="))
          subprocess.run([sys.executable, "-m", "pip", "install", requirement], check=True)
          PY
      - name: Verify the source before the fix
        run: |
          git worktree add --detach "$RUNNER_TEMP/matic-before" a9dde1f1caf47ac52429939fc5a76b4a4ff798b8
          if [ "$HA_VERSION" = "2026.9.3" ]; then
            .compat-venv/bin/python scripts/check_panel_setup_acceptance.py --components "$RUNNER_TEMP/matic-before/custom_components"
          else
            .compat-venv/bin/python scripts/check_panel_setup_acceptance.py --components "$RUNNER_TEMP/matic-before/custom_components" --expect-safe-area-error
          fi
      - name: Verify the merged fix
        run: |
          git diff --exit-code a194ee6b7f428946977bbce2dcbc12cad8c457ba -- custom_components
          .compat-venv/bin/python scripts/check_panel_setup_acceptance.py --components "$GITHUB_WORKSPACE/custom_components"
