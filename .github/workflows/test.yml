name: Test

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: python3 .github/scripts/delivery-contract.py .
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[test]'
      - run: pytest --cov=custom_components/matic_robot --cov-report=term-missing
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy custom_components/matic_robot
      - run: python scripts/check_public_tree.py
      - run: python -m build
      - run: python scripts/check_release_artifacts.py dist
      - run: python scripts/check_fresh_install.py dist

  ci:
    name: ci
    needs: [test]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every lane to succeed
        env:
          RESULT: ${{ needs.test.result }}
        run: |
          echo "test: $RESULT"
          [ "$RESULT" = "success" ]
