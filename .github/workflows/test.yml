name: Test

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main, "release/**"]
  workflow_dispatch:

permissions:
  contents: read

# Every PR runs the same gates, whoever opened it. A title or body edit changes
# no code: its run reports the last code run for the same head instead of
# rerunning the suite. A base change reruns everything.
env:
  RECHECK: ${{ github.event.action == 'edited' && !github.event.changes.base }}

# A push gets its own group: a shared one drops the queued run when another
# merge lands behind it.
concurrency:
  group: >-
    ${{ github.workflow }}-${{
    github.event_name == 'push' && github.sha || github.ref }}-${{
    github.event.action == 'edited' && !github.event.changes.base
    && github.run_id || 'code' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ github.event.action == 'edited' && !github.event.changes.base && 60 || 20 }}
    permissions:
      actions: read
      checks: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.14"]
    steps:
      # With its parents, so check.py can tell what the head changes.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - run: python3 .github/scripts/delivery-contract.py .
      # The required check is this job, so an edit run reports the last code
      # run of it rather than skipping, which would read as passing.
      - if: ${{ fromJSON(env.RECHECK) }}
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: .github/scripts/last-code-run.sh "test (${{ matrix.python-version }})"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: ${{ !fromJSON(env.RECHECK) }}
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        if: ${{ !fromJSON(env.RECHECK) }}
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      # uv.lock pins every tool, and a stale lockfile fails the install.
      - run: |
          python -m pip install uv
          uv sync --locked
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
        if: ${{ !fromJSON(env.RECHECK) }}
      # Builds Matic Map, which the tests read and the zip ships. A pull
      # request is checked out as its merge into the base branch, so the first
      # parent is that branch and the change must come with tests. A release
      # branch is exempt: its changes were held to that on their way in.
      - run: python scripts/check.py --all ${BASE:+--base "$BASE"}
        if: ${{ !fromJSON(env.RECHECK) }}
        env:
          BASE: >-
            ${{ github.event_name == 'pull_request'
            && !(startsWith(github.head_ref, 'release/')
            && github.event.pull_request.head.repo.full_name == github.repository)
            && 'HEAD^1' || '' }}
      # The zip a release ships, kept so an unreleased head can be installed.
      - run: python scripts/release.py zip
        if: ${{ !fromJSON(env.RECHECK) }}
      - run: python scripts/check_fresh_install.py
        if: ${{ !fromJSON(env.RECHECK) }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !fromJSON(env.RECHECK) }}
        with:
          path: dist/matic_robot.zip
          archive: false
          if-no-files-found: error

  # Matic Map in a real Home Assistant paired to the simulated robot. Home
  # Assistant installs its own dependencies' requirements at startup.
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      checks: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - if: ${{ fromJSON(env.RECHECK) }}
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: .github/scripts/last-code-run.sh live
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: ${{ !fromJSON(env.RECHECK) }}
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        if: ${{ !fromJSON(env.RECHECK) }}
        with:
          python-version: "3.14"
          cache: pip
      # Home Assistant installs integration requirements (frontend, bluetooth,
      # usb) at startup. It does that reliably into an active virtual
      # environment; on the bare setup-python interpreter it left them missing.
      - run: |
          python -m pip install uv
          uv sync --locked
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
        if: ${{ !fromJSON(env.RECHECK) }}
      - run: npm ci
        if: ${{ !fromJSON(env.RECHECK) }}
      - run: npm run build:map-studio-v4
        if: ${{ !fromJSON(env.RECHECK) }}
      - run: npx playwright install --with-deps chromium
        if: ${{ !fromJSON(env.RECHECK) }}
      - run: npx playwright test --config playwright.live.config.mjs
        env:
          MATIC_LIVE_WORKSPACE_PUSH: paired
        if: ${{ !fromJSON(env.RECHECK) }}

  ci:
    name: ci
    needs: [test, live]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every lane to succeed
        env:
          TEST: ${{ needs.test.result }}
          LIVE: ${{ needs.live.result }}
        run: |
          echo "test: $TEST, live: $LIVE"
          [ "$TEST" = "success" ] && [ "$LIVE" = "success" ]
