# Generated adapter; edit scripts/review-gate/adapters in ProspectOre/dev-workspace.
name: Reconcile Completed Signed Review Capture

on:
  workflow_run:
    workflows: [Regular Review Gate]
    types: [completed]

concurrency:
  group: review-capture-completion-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

permissions:
  actions: write
  contents: read
  pull-requests: read
  statuses: write

jobs:
  reconcile:
    name: reconcile completed signed capture
    if: >-
      github.event.workflow_run.event == 'workflow_dispatch'
      && github.event.workflow_run.conclusion == 'success'
      && github.event.workflow_run.head_branch == github.event.repository.default_branch
      && contains(github.event.workflow_run.display_title, ' | event-capture=')
    runs-on: ${{ vars.USE_HOSTED_RUNNERS != 'false' && vars.USE_HOSTED_LINUX != 'false' && 'ubuntu-latest' || fromJSON('["self-hosted","macOS","ARM64","mbp"]') }}
    steps:
      - name: Verify completed capture, publish receipts, and queue its audit
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
        shell: bash
        run: |
          set -euo pipefail
          export PATH="/opt/homebrew/bin:/usr/local/bin:$PATH"
          [[ "$REPO" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]
          [[ "$SOURCE_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$DEFAULT_BRANCH" =~ ^[A-Za-z0-9._/-]+$ ]]
          workflow_id="$(gh api "repos/$REPO/actions/workflows/review-gate.yml" --jq '.id | select(type == "number" and . > 0)')"
          [[ "$workflow_id" =~ ^[1-9][0-9]*$ ]]
          source_run="$(gh api "repos/$REPO/actions/runs/$SOURCE_RUN_ID")"
          identity="$(jq -er --arg repo "$REPO" --arg branch "$DEFAULT_BRANCH" \
              --arg id "$SOURCE_RUN_ID" --arg workflow "$workflow_id" '
            select(.id == ($id | tonumber)
              and .workflow_id == ($workflow | tonumber)
              and .repository.full_name == $repo
              and (.path == ".github/workflows/review-gate.yml"
                or .path == (".github/workflows/review-gate.yml@" + $branch))
              and .event == "workflow_dispatch"
              and .head_branch == $branch
              and .status == "completed"
              and .conclusion == "success")
            | .display_title
            | capture("^Review gate PR #(?<pr>[1-9][0-9]*) \\| policy-workflow-sha=[0-9a-f]{40}"
              + " \\| event-capture=(?<capture>[1-9][0-9]*) \\| event-head=(?<head>[0-9a-f]{40})"
              + " \\| event-history-head=(?<history>[0-9a-f]{40})$")
            | [.pr, .capture, .head, .history] | @tsv
          ' <<< "$source_run")"
          IFS=$'\t' read -r pr_number capture_id event_head history_head <<< "$identity"
          [[ "$pr_number" =~ ^[1-9][0-9]*$ && "$capture_id" =~ ^[1-9][0-9]*$ ]]
          [[ "$event_head" =~ ^[0-9a-f]{40}$ && "$history_head" =~ ^[0-9a-f]{40}$ ]]
          pull_request="$(gh api "repos/$REPO/pulls/$pr_number")"
          jq -e --arg pr "$pr_number" --arg repo "$REPO" --arg branch "$DEFAULT_BRANCH" '
            .number == ($pr | tonumber)
            and .base.repo.full_name == $repo
            and .base.ref == $branch
          ' <<< "$pull_request" >/dev/null
          receipt_heads=("$event_head")
          if [[ "$history_head" != "$event_head" ]]; then receipt_heads+=("$history_head"); fi
          for receipt_head in "${receipt_heads[@]}"; do
            for attempt in 1 2 3; do
              if gh api "repos/$REPO/statuses/$receipt_head" --silent \
                -f state=success -f context="review-event-capture/$capture_id" \
                -f description="Review event capture consumed for PR #$pr_number" \
                -f target_url="$GITHUB_SERVER_URL/$REPO/actions/runs/$SOURCE_RUN_ID"; then break; fi
              [[ "$attempt" == 3 ]] && exit 1
              sleep "$attempt"
            done
          done
          for attempt in 1 2 3; do
            if gh workflow run review-gate.yml --repo "$REPO" --ref "$DEFAULT_BRANCH" \
              -f pull_request="$pr_number" -F audit=true; then break; fi
            [[ "$attempt" == 3 ]] && exit 1
            sleep "$attempt"
          done
