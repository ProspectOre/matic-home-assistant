# Generated adapter; edit scripts/review-gate/adapters and render.py.
name: Quarantine Fork Review Events

on:
  workflow_run:
    workflows: [Route Regular Codex Review Events]
    types: [completed]

# This is an invalidation signal only. Signed capture remains the sole event
# authority; no candidate code, artifacts, receipts or verdicts are consumed.
permissions:
  actions: read
  contents: read
  pull-requests: read
  statuses: write

jobs:
  quarantine:
    if: contains(fromJSON('["pull_request_review","pull_request_review_comment"]'), github.event.workflow_run.event)
    runs-on: ${{ vars.USE_HOSTED_RUNNERS != 'false' && vars.USE_HOSTED_LINUX != 'false' && 'ubuntu-latest' || fromJSON('["self-hosted","macOS","ARM64","mbp"]') }}
    timeout-minutes: 5
    steps:
      - name: Quarantine the provider-associated fork head
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          REPOSITORY_ID: ${{ github.repository_id }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_RUN_ID" =~ ^[1-9][0-9]*$ && "$REPOSITORY_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$DEFAULT_BRANCH" =~ ^[A-Za-z0-9._/-]+$ ]]
          [[ "$GITHUB_WORKFLOW_REF" == "$REPO/.github/workflows/review-fork-quarantine.yml@refs/heads/$DEFAULT_BRANCH" ]]
          workflow_id="$(gh api "repos/$REPO/actions/workflows/review-regular-review.yml" --jq '.id')"
          [[ "$workflow_id" =~ ^[1-9][0-9]*$ ]]
          run="$(gh api "repos/$REPO/actions/runs/$SOURCE_RUN_ID")"
          printf '%s' "$run" | jq -e --arg repo "$REPO" --arg id "$SOURCE_RUN_ID" \
            --arg workflow "$workflow_id" --arg repository "$REPOSITORY_ID" '
              .id == ($id | tonumber) and .workflow_id == ($workflow | tonumber)
              and .repository.id == ($repository | tonumber)
              and .repository.full_name == $repo
              and (.path | split("@")[0]) == ".github/workflows/review-regular-review.yml"
              and (.event == "pull_request_review" or .event == "pull_request_review_comment")
              and .status == "completed"
              and (.head_sha | type == "string" and test("^[0-9a-f]{40}$"))
              and (.pull_requests | type == "array")' >/dev/null
          run_head="$(printf '%s' "$run" | jq -r '.head_sha')"
          prs="$(printf '%s' "$run" | jq -c '[.pull_requests[].number] | unique')"
          if [[ "$prs" == '[]' ]]; then
            # Provider association only. A full page is incomplete, never proof
            # that an unseen association cannot change this target selection.
            associations="$(gh api "repos/$REPO/commits/$run_head/pulls?per_page=100")"
            printf '%s' "$associations" | jq -e 'type == "array" and length < 100' >/dev/null
            prs="$(printf '%s' "$associations" | jq -c --arg repo "$REPO" \
              '[.[] | select(.base.repo.full_name == $repo) | .number] | unique')"
          fi
          printf '%s' "$prs" | jq -e 'length == 1 and (.[0] | type == "number" and . > 0 and floor == .)' >/dev/null
          pr="$(printf '%s' "$prs" | jq -r '.[0]')"
          candidate="$(gh api "repos/$REPO/pulls/$pr")"
          # Review workflow runs identify a merge ref, not the fork candidate.
          # Resolve the live fork independently, then require its exact handoff.
          if ! printf '%s' "$candidate" | jq -e --arg repo "$REPO" --arg pr "$pr" \
            --arg branch "$DEFAULT_BRANCH" --arg repository "$REPOSITORY_ID" '
              .number == ($pr | tonumber) and .state == "open"
              and .base.repo.id == ($repository | tonumber) and .base.repo.full_name == $repo
              and (.base.ref == $branch
                or ($repo == "ProspectOre/matic-home-assistant" and .base.ref == "release/0.4"))
              and (.head.sha | type == "string" and test("^[0-9a-f]{40}$"))
              and (.head.repo.full_name | type == "string" and length > 0)
              and .head.repo.full_name != $repo' >/dev/null; then
            echo 'No unambiguous current fork candidate matched.'
            exit 0
          fi
          head="$(printf '%s' "$candidate" | jq -r '.head.sha')"
          fork="$(printf '%s' "$candidate" | jq -r '.head.repo.full_name')"
          # Job metadata is an invalidation signal only, never capture proof.
          # A route-only run from an unrelated author supplies no fork handoff.
          jobs="$(gh api "repos/$REPO/actions/runs/$SOURCE_RUN_ID/jobs?filter=latest&per_page=100")"
          printf '%s' "$jobs" | jq -e '.jobs | type == "array" and length < 100' >/dev/null
          if ! printf '%s' "$jobs" | jq -e --arg id "$SOURCE_RUN_ID" --arg pr "$pr" --arg head "$head" '
              [.jobs[] | select(.run_id == ($id | tonumber)
                and .status == "completed" and .conclusion == "success"
                and (.name | type == "string" and test(
                  "^fork-regular-review-" + $pr + "-" + $head + "-[1-9][0-9]*-(true|false)$")))]
              | length == 1' >/dev/null; then
            echo 'No unique successful fork review handoff matched.'
            exit 0
          fi
          current="$(gh api "repos/$REPO/pulls/$pr")"
          # Same-repository and stale-head deliveries cannot quarantine another
          # candidate. Deleted or ambiguous fork identity supplies no target.
          if ! printf '%s' "$current" | jq -e --arg repo "$REPO" --arg head "$head" \
            --arg pr "$pr" --arg branch "$DEFAULT_BRANCH" --arg repository "$REPOSITORY_ID" \
            --arg fork "$fork" '
              .number == ($pr | tonumber) and .state == "open"
              and .base.repo.id == ($repository | tonumber) and .base.repo.full_name == $repo
              and (.base.ref == $branch
                or ($repo == "ProspectOre/matic-home-assistant" and .base.ref == "release/0.4"))
              and .head.sha == $head
              and (.head.repo.full_name | type == "string" and length > 0)
              and .head.repo.full_name != $repo and .head.repo.full_name == $fork' >/dev/null; then
            echo 'No current fork target matched the provider run.'
            exit 0
          fi
          for attempt in 1 2 3; do
            if gh api "repos/$REPO/statuses/$head" -X POST -f state=pending \
              -f context=review-gate \
              -f description="Fork review run $SOURCE_RUN_ID requires signed capture" >/dev/null; then
              exit 0
            fi
            echo "Pending fork quarantine write attempt $attempt failed."
            sleep 1
          done
          exit 1
