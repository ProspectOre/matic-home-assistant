name: Claude Review

# Runs only when the repository variable REVIEW_PROVIDER is "claude"; the
# review-gate workflows read the same variable to decide which bot identity
# satisfies the gate, so switching providers is one variable flip with the
# Codex flow as the unset default.
on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  id-token: write
  # Needed to dispatch the review gate once a verdict is published.
  actions: write

jobs:
  review:
    name: claude-review
    if: >-
      vars.REVIEW_PROVIDER == 'claude'
      && github.event.pull_request.draft == false
    runs-on: ${{ vars.USE_HOSTED_RUNNERS != 'false' && vars.USE_HOSTED_LINUX != 'false' && 'ubuntu-latest' || fromJSON('["self-hosted","macOS","ARM64","mbp"]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@833fb0f8c9f6686b33d963a8bae0a94f4936ab2a # v1
        id: review
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: >-
            --allowedTools "Read,Grep,Glob,LS,Bash(gh pr diff:*),Bash(gh pr
            view:*)" --disallowedTools "Task"
          prompt: |
            You are this repository's regular review gate. Review pull request
            #${{ github.event.pull_request.number }} of
            ${{ github.repository }} at exactly head commit
            ${{ github.event.pull_request.head.sha }}.

            Read the full diff with `gh pr diff`, open any file you need, and
            hold the change to this repository's bar (CLAUDE.md and
            CONTRIBUTING.md): correctness bugs first; privacy (no credentials,
            serials, addresses, captures, maps, or Home Assistant storage
            contents); protocol safety (no command from a guessed enum or
            payload); rotation and completion-evidence invariants; and test
            adequacy for changed behavior. Review only — never edit files,
            push commits, approve, or request changes.

            Do the reading and judging yourself in this one turn. Do not
            delegate to subagents and do not defer any part of the verdict to
            later work: nothing runs after your final message, so a promise to
            report back publishes nothing at all.

            When done, return the verdict as your final message and nothing
            else. Do not call any write API: this workflow publishes your
            final message as the pull request review.

            If the change has no blocking findings, your final message must be
            exactly these two lines:

            ## Review result: No issues found.

            **Reviewed commit:** `${{ github.event.pull_request.head.sha }}`

            If there are blocking findings, your final message must start with
            the heading `## Review result: findings`, followed by the line
            **Reviewed commit:** `${{ github.event.pull_request.head.sha }}`
            and then a numbered list giving file:line, the defect, and a
            concrete failure scenario for every finding.

            Your final message must always begin with `## Review result:`. If
            you cannot complete the review, say so in a final message that
            does not begin with that heading, and nothing will be published.

      # The reviewer holds no write tools, so publish its verdict here instead.
      # This step is the trusted publisher: it posts under the workflow's own
      # token, having checked the verdict shape, and names the head straight
      # from the event context. review-gate.yml therefore looks for
      # github-actions[bot] as the reviewing identity for this provider.
      # Skipped when the action itself did not run, which is what happens on
      # any pull request that edits this workflow file. A run that did happen
      # but produced no usable verdict still fails below.
      - name: Publish the review verdict
        if: steps.review.outputs.execution_file != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EXECUTION_FILE: ${{ steps.review.outputs.execution_file }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ ! -s "$EXECUTION_FILE" ]; then
            echo "The execution output file $EXECUTION_FILE is missing or empty." >&2
            exit 1
          fi
          # Record the shape of the transcript so a future extraction failure
          # is diagnosable from the log alone.
          echo "Transcript entry types:"
          jq -r '[.[] | .type] | join(" ")' "$EXECUTION_FILE" || true
          body="$(jq -r '[.[] | select(.type == "result") | .result // empty] | last // empty' "$EXECUTION_FILE")"
          if [ -z "$body" ]; then
            body="$(jq -r '[.[] | select(.type == "assistant") | .message.content[]? | select(.type == "text") | .text] | last // empty' "$EXECUTION_FILE")"
          fi
          if [ -z "$body" ]; then
            echo "Could not extract a verdict from the transcript." >&2
            exit 1
          fi
          # The verdict is the contract, not what leads up to it. Reviewers
          # tend to narrate before the heading ("Now I have everything I need
          # for the verdict."), and review-gate.yml anchors its match to the
          # start of the body, so publish from the heading onwards rather than
          # discarding an otherwise complete review over its preamble.
          verdict="$(printf '%s\n' "$body" | awk '
            tolower($0) ~ /^[[:space:]]*#+[[:space:]]*review result:/ { found = 1 }
            found { print }
          ')"
          if [ -z "${verdict//[[:space:]]/}" ]; then
            echo "The reviewer did not return a verdict; publishing nothing." >&2
            printf '%s\n' "$body" >&2
            exit 1
          fi
          if [ "$verdict" != "$body" ]; then
            echo "Dropped preamble before the verdict heading." >&2
          fi
          body="$verdict"
          # A clean verdict must be the heading and the reviewed-commit line
          # and nothing else. review-gate.yml anchors its match to the end of
          # the body, so trailing prose would post a review the gate then
          # silently ignores, which is indistinguishable from never having
          # reviewed at all. Fail here instead, where the reason is visible.
          if printf '%s' "$body" | head -n 1 | grep -qiE '^##[[:space:]]*Review result:[[:space:]]*No issues found\.[[:space:]]*$'; then
            if [ "$(printf '%s\n' "$body" | grep -cvE '^[[:space:]]*$')" -ne 2 ]; then
              echo "A clean verdict carried extra text; the gate would ignore it." >&2
              printf '%s\n' "$body" >&2
              exit 1
            fi
          fi
          # Take the reviewed commit straight from the trusted event context,
          # so the evidence can only ever name this pull request's exact head.
          gh api "repos/$REPO/pulls/$PR_NUMBER/reviews" \
            -f commit_id=${{ github.event.pull_request.head.sha }} \
            -f event=COMMENT \
            -f body="$body"
          # A review posted with GITHUB_TOKEN raises no pull_request_review
          # event, by design, so the gate's routers never see this verdict and
          # its status would sit on the previous evaluation indefinitely. Ask
          # the gate to re-read the pull request now that the evidence exists.
          gh workflow run review-gate.yml -f pull_request="$PR_NUMBER"
