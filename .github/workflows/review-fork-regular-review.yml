name: Reconcile Fork Regular Review Events

on:
  workflow_run:
    workflows: [Route Regular Codex Review Events]
    types: [completed]

permissions:
  actions: write
  contents: read
  pull-requests: read
  statuses: write

jobs:
  reconcile:
    if: >-
      github.event.workflow_run.conclusion == 'success'
      && github.event.workflow_run.event == 'pull_request_review'
      && github.event.workflow_run.pull_requests[0].number != null
    runs-on: ${{ vars.USE_HOSTED_RUNNERS != 'false' && vars.USE_HOSTED_LINUX != 'false' && 'ubuntu-latest' || fromJSON('["self-hosted","macOS","ARM64","mbp"]') }}
    steps:
      - name: Re-evaluate the affected fork pull request
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
          REPO: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]]
          run_head_sha="$(gh api "repos/$REPO/actions/runs/${{ github.event.workflow_run.id }}" --jq '.head_sha')"
          [[ "$run_head_sha" =~ ^[0-9a-f]{40}$ ]]
          head_sha="$(gh api "repos/$REPO/pulls/$PR_NUMBER" --jq '.head.sha')"
          [[ "$head_sha" =~ ^[0-9a-f]{40}$ ]]
          [[ "$run_head_sha" == "$head_sha" ]] || { echo "Ignoring a fork-review workflow for stale head $run_head_sha."; exit 0; }
          head_repo="$(gh api "repos/$REPO/pulls/$PR_NUMBER" --jq '.head.repo.full_name // empty')"
          [[ -n "$head_repo" && "$head_repo" != "$REPO" ]] || { echo "Ignoring a same-repository review workflow."; exit 0; }
          gh api "repos/$REPO/statuses/$head_sha" --silent \
            -f state=pending -f context=review-gate \
            -f description='Fork review changed; reevaluating exact head' \
            -f target_url="$GITHUB_SERVER_URL/$REPO/actions/runs/${{ github.run_id }}"
          latest_review="$(gh api "repos/$REPO/pulls/$PR_NUMBER/reviews?per_page=100" | jq -c --arg head "$head_sha" '[.[] | select(.commit_id == $head)] | sort_by(.updated_at // .submitted_at) | last // empty')"
          review_invalidated=false
          if [[ -n "$latest_review" ]]; then
            review_state="$(jq -r '.state // ""' <<< "$latest_review")"
            review_body="$(jq -r '.body // ""' <<< "$latest_review")"
            review_submitted="$(jq -r '.submitted_at // ""' <<< "$latest_review")"
            review_updated="$(jq -r '.updated_at // ""' <<< "$latest_review")"
            if [[ "$review_state" == "DISMISSED" ]] || { [[ "$review_updated" != "$review_submitted" ]] && ! grep -Eiq '(^|[[:space:]#])codex[[:space:]]+review([[:space:]]|:|$)|(^|[[:space:]#])review[[:space:]]+result([[:space:]]|:|$)' <<< "$review_body"; }; then
              review_invalidated=true
            fi
          fi
          if [[ "$review_invalidated" == true ]]; then
            gh api "repos/$REPO/statuses/$head_sha" --silent \
              -f state=pending -f context=review-gate-regular-review \
              -f description="Regular review invalidated; fork review delivery" \
              -f target_url="$GITHUB_SERVER_URL/$REPO/actions/runs/$GITHUB_RUN_ID"
          fi
          gh workflow run review-gate.yml --repo "$REPO" --ref "$DEFAULT_BRANCH" \
            -f pull_request="$PR_NUMBER"
