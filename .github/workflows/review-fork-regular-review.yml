name: Reconcile Fork Regular Review Events

on:
  workflow_run:
    workflows: [Route Regular Codex Review Events]
    types: [completed]

permissions:
  actions: write
  contents: read
  pull-requests: read
  statuses: write

jobs:
  reconcile:
    if: >-
      github.event.workflow_run.conclusion == 'success'
      && github.event.workflow_run.head_branch == github.event.repository.default_branch
      && github.event.workflow_run.pull_requests[0].number != null
    runs-on: ${{ vars.USE_HOSTED_RUNNERS != 'false' && vars.USE_HOSTED_LINUX != 'false' && 'ubuntu-latest' || fromJSON('["self-hosted","macOS","ARM64","mbp"]') }}
    steps:
      - name: Re-evaluate the affected fork pull request
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
          REPO: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]]
          gh workflow run review-gate.yml --repo "$REPO" --ref "$DEFAULT_BRANCH" \
            -f pull_request="$PR_NUMBER" -f runner_route=mbp
