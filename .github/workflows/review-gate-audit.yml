# Generated adapter; edit scripts/review-gate/adapters in ProspectOre/dev-workspace.
name: Audit Active Regular Review Findings

on:
  schedule:
    - cron: '12-59/15 * * * *'
  workflow_dispatch:

# GitHub Actions does not expose review-thread reopening as an Actions trigger.
# Protected branches require conversation resolution, so an active or reopened
# thread blocks a merge immediately. Signed event completions dispatch a
# targeted audit; this low-frequency audit recovers missed events and transient
# router failures without posting comments or requesting another review.
permissions:
  actions: write
  contents: read
  issues: read
  pull-requests: write
  statuses: write

jobs:
  discover:
    name: discover-open-prs
    runs-on: ${{ vars.USE_HOSTED_RUNNERS != 'false' && vars.USE_HOSTED_LINUX != 'false' && 'ubuntu-latest' || fromJSON('["self-hosted","macOS","ARM64","mbp"]') }}
    outputs:
      matrix: ${{ steps.prs.outputs.matrix }}
      count: ${{ steps.prs.outputs.count }}
    steps:
      - id: prs
        name: Enumerate open pull requests
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          export PATH="/opt/homebrew/bin:/usr/local/bin:$PATH"
          command -v gh >/dev/null 2>&1 || {
            echo "GitHub CLI (gh) is required."
            exit 1
          }
          matrix="$(
            gh api "repos/$REPO/pulls?state=open&per_page=100" --paginate --slurp \
              | jq -c '{include: [.[][] | {pr_number: .number}]}'
          )"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "count=$(jq '.include | length' <<< "$matrix")" >> "$GITHUB_OUTPUT"

  audit:
    name: audit (${{ matrix.pr_number }})
    needs: discover
    if: needs.discover.outputs.count != '0'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.discover.outputs.matrix) }}
    # Recheck under the evaluator's per-PR lock so an in-flight success cannot
    # race a findings-triggered follow-up dispatch.
    concurrency:
      group: review-gate-${{ matrix.pr_number }}
      cancel-in-progress: false
    runs-on: ${{ vars.USE_HOSTED_RUNNERS != 'false' && vars.USE_HOSTED_LINUX != 'false' && 'ubuntu-latest' || fromJSON('["self-hosted","macOS","ARM64","mbp"]') }}
    steps:
      - id: canonical
        name: Load pinned canonical review policy
        env:
          AUDIT_MODE: true
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          POLICY_REF: ${{ github.workflow_sha }}
          PR_NUMBER: ${{ matrix.pr_number }}
          EVENT_PR_NUMBER: ${{ github.event.pull_request.number }}
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HISTORY_HEAD_SHA:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          EXPECTED_SHA256: '74184ccb3357579a5ba71d42e44f8b6d3cb582c4c5eacb77be5ec031d6d9d949'
          EXPECTED_DEPENDENCY_SHA256: '3dfc642b88404487cd5a7cb91c60ab054067f617b867813a5bacb0c80a701455'
          EXPECTED_REVIEW_SECTIONS_SHA256: '6ce6aabc2e112bee41d821b2aea5f20d5f50643cab8ff179f67ae6d8e0c136b9'
          EXPECTED_ISSUE_COMMENT_RECEIPTS_SHA256: 'bf9ad41c2e35b4a2e32d6968afeba87c1eaebb48878445bcfeed658ff602afd5'
        shell: bash
        run: |
          set -euo pipefail
          export PATH="/opt/homebrew/bin:/usr/local/bin:$PATH"
          [[ "$GITHUB_WORKFLOW_REF" == "$REPO/.github/workflows/"*"@refs/heads/$DEFAULT_BRANCH" ]] || exit 1
          [[ "$POLICY_REF" =~ ^[0-9a-f]{40}$ && "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]] || exit 1
          # Revoke the authenticated event head before the first fallible PR
          # lookup. The event payload (or signed relay output) binds this SHA
          # to PR_NUMBER; membership is checked after the safety barrier.
          if [[ "${AUDIT_MODE:-false}" != true && "${EVENT_PR_NUMBER:-}" == "$PR_NUMBER" \
                && "${EVENT_HEAD_SHA:-}" =~ ^[0-9a-f]{40}$ ]]; then
            gh api "repos/$REPO/statuses/$EVENT_HEAD_SHA" --silent -f state=pending \
              -f context=review-gate -f description='Loading canonical review policy' \
              -f target_url="$GITHUB_SERVER_URL/$REPO/actions/runs/$GITHUB_RUN_ID"
          fi
          pr="$(gh api "repos/$REPO/pulls/$PR_NUMBER")"
          pr_head="$(jq -er '.head.sha' <<< "$pr")"
          [[ "$pr_head" =~ ^[0-9a-f]{40}$ ]] || exit 1
          # Revoke the live PR head before any secondary membership reads.
          if [[ "${AUDIT_MODE:-false}" != true && "$(jq -r '.state' <<< "$pr")" == open \
                && ( "${EVENT_PR_NUMBER:-}" != "$PR_NUMBER" || "$pr_head" != "${EVENT_HEAD_SHA:-}" ) ]]; then
            gh api "repos/$REPO/statuses/$pr_head" --silent -f state=pending \
              -f context=review-gate -f description='Loading canonical review policy' \
              -f target_url="$GITHUB_SERVER_URL/$REPO/actions/runs/$GITHUB_RUN_ID"
          fi
          commit_associated_with_pr() {
            local target_sha="$1" associated
            [[ "$target_sha" =~ ^[0-9a-f]{40}$ ]] || return 1
            [[ "$target_sha" == "$pr_head" ]] && return 0
            associated="$(gh api "repos/$REPO/commits/$target_sha/pulls?per_page=100" --paginate --slurp \
              | jq -ce --arg repo "$REPO" --argjson pr "$PR_NUMBER" '
                  if type != "array" or any(.[]; type != "array") then
                    error("Invalid commit-associated PR pages")
                  else any(.[][]; .number == $pr and .base.repo.full_name == $repo)
                  end')" || return 1
            [[ "$associated" == true ]]
          }
          if [[ "${AUDIT_MODE:-false}" != true && "${EVENT_PR_NUMBER:-}" == "$PR_NUMBER" \
                && "${EVENT_HEAD_SHA:-}" =~ ^[0-9a-f]{40}$ ]] \
                && ! commit_associated_with_pr "$EVENT_HEAD_SHA"; then
            echo "Authenticated event head is not associated with PR #$PR_NUMBER." >&2
            exit 1
          fi
          resolve_associated_commit_ref() {
            local target_ref="$1" resolved
            [[ "$target_ref" =~ ^[0-9a-f]{10}([0-9a-f]{30})?$ ]] || return 1
            resolved="$(gh api "repos/$REPO/commits/$target_ref" --jq '.sha')" || return 1
            [[ "$resolved" =~ ^[0-9a-f]{40}$ && "$resolved" == "$target_ref"* ]] || return 1
            commit_associated_with_pr "$resolved" || return 1
            printf '%s\n' "$resolved"
          }
          if [[ "${AUDIT_MODE:-false}" != true && "${HISTORY_HEAD_SHA:-}" =~ ^[0-9a-f]{40}$ \
                && "$HISTORY_HEAD_SHA" != "${EVENT_HEAD_SHA:-}" ]] \
                && commit_associated_with_pr "$HISTORY_HEAD_SHA"; then
            gh api "repos/$REPO/statuses/$HISTORY_HEAD_SHA" --silent -f state=pending \
              -f context=review-gate -f description='Relayed review event pending history reconciliation' \
              -f target_url="$GITHUB_SERVER_URL/$REPO/actions/runs/$GITHUB_RUN_ID"
          fi
          # Authenticated review comments carry their reviewed commit even
          # though issue_comment payloads have no pull_request.head object.
          # GitHub resolves a unique abbreviated SHA in this status write;
          # ambiguous/invalid refs fail rather than preserving stale success.
          if [[ "${AUDIT_MODE:-false}" != true && -f "${GITHUB_EVENT_PATH:-}" ]]; then
            comment_heads="$(jq -r --arg pr "$PR_NUMBER" '
              def coordinator_head:
                select(test("(?is)\\A[[:space:]]*@codex review[ \\t]*\\r?\\n[[:space:]]*(?:Review current head \\x60[0-9a-f]{40}\\x60\\.(?: Report concrete correctness, security, and regression defects with their triggering conditions\\. Assess related cases together; omit style-only preferences\\.)?[ \\t]*\\r?\\n[[:space:]]*)?<!--[[:space:]]*review-request:v2[[:space:]]+head=[0-9a-f]{40}[[:space:]]+base=[0-9a-f]{40}[[:space:]]*-->[[:space:]]*(?:\\r?\\n|$)"))
                | capture("<!--[[:space:]]*review-request:v2[[:space:]]+head=(?<head>[0-9a-f]{40})[[:space:]]+base=[0-9a-f]{40}[[:space:]]*-->").head;
              select(.issue.pull_request != null and (.issue.number | tostring) == $pr)
              | select(.comment.user.login == "chatgpt-codex-connector[bot]" and .comment.user.id == 199175422 and .comment.user.type == "Bot")
              | [.comment.body // "", .changes.body.from // ""]
              | [.[] | ((scan("(?i)reviewed commit:[*]*[ \t]*`([0-9a-f]{40}|[0-9a-f]{10})`") | .[0] | ascii_downcase), coordinator_head)] | unique[]' "$GITHUB_EVENT_PATH")"
            while IFS= read -r comment_head; do
              [[ -n "$comment_head" ]] || continue
              resolved_comment_head="$(resolve_associated_commit_ref "$comment_head")" || continue
              gh api "repos/$REPO/statuses/$resolved_comment_head" --silent -f state=pending \
                -f context=review-gate -f description='Review comment changed; loading canonical policy' \
                -f target_url="$GITHUB_SERVER_URL/$REPO/actions/runs/$GITHUB_RUN_ID"
            done <<< "$comment_heads"
          fi
          policy="$(mktemp "$RUNNER_TEMP/review-policy.XXXXXX")"
          trap 'rm -f "$policy" "$policy.dependencies.py" "$policy.review-sections.py" "$policy.issue-comment-receipts.py"' EXIT
          gh api -H 'Accept: application/vnd.github.raw+json' \
            "repos/$REPO/contents/.github/review-gate/evaluate.sh?ref=$POLICY_REF" > "$policy"
          gh api -H 'Accept: application/vnd.github.raw+json' \
            "repos/$REPO/contents/.github/review-gate/classify_dependencies.py?ref=$POLICY_REF" > "$policy.dependencies.py"
          sections_path="$policy.review-sections.py"
          gh api -H 'Accept: application/vnd.github.raw+json' \
            "repos/$REPO/contents/.github/review-gate/review_sections.py?ref=$POLICY_REF" > "$sections_path"
          actual="$(shasum -a 256 "$policy")"
          [[ "${actual%% *}" == "$EXPECTED_SHA256" ]] || exit 1
          actual="$(shasum -a 256 "$policy.dependencies.py")"
          [[ "${actual%% *}" == "$EXPECTED_DEPENDENCY_SHA256" ]] || exit 1
          actual="$(shasum -a 256 "$sections_path")"
          [[ "${actual%% *}" == "$EXPECTED_REVIEW_SECTIONS_SHA256" ]] || exit 1
          chmod 400 "$sections_path"
          receipt_path=""
          if [[ -n "$EXPECTED_ISSUE_COMMENT_RECEIPTS_SHA256" ]]; then
            receipt_path="$policy.issue-comment-receipts.py"
            gh api -H 'Accept: application/vnd.github.raw+json' \
              "repos/$REPO/contents/.github/review-gate/issue_comment_receipts.py?ref=$POLICY_REF" > "$receipt_path"
            actual="$(shasum -a 256 "$receipt_path")"
            [[ "${actual%% *}" == "$EXPECTED_ISSUE_COMMENT_RECEIPTS_SHA256" ]] || exit 1
            chmod 400 "$receipt_path"
          fi
          chmod 400 "$policy" "$policy.dependencies.py"
          {
            echo "path=$policy"
            echo "sections_path=$sections_path"
            echo "receipt_path=$receipt_path"
          } >> "$GITHUB_OUTPUT"
          trap - EXIT
      - name: Reconcile canonical review policy
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          REVIEW_BOT: chatgpt-codex-connector[bot]
          REVIEW_BOT_LOGIN: chatgpt-codex-connector
          REVIEW_BOT_EVENT_LOGIN: chatgpt-codex-connector[bot]
          REVIEW_GATE_CONTEXT: review-gate
          REVIEW_ROLLOUT_CONTEXT: review-gate-rollout
          REVIEW_BASE_CONTEXT: review-gate-base-change
          REVIEW_COMMENT_CONTEXT: review-gate-regular-comment
          REVIEW_REVIEW_CONTEXT: review-gate-regular-review
          REVIEW_SECTIONS_SCRIPT: ${{ steps.canonical.outputs.sections_path }}
          AUDIT_MODE: true
          CANONICAL_REVIEW_GATE: ${{ steps.canonical.outputs.path }}
          ISSUE_COMMENT_RECEIPTS_SCRIPT: ${{ steps.canonical.outputs.receipt_path }}
          REQUIRE_CLEAN_ISSUE_COMMENT_RECEIPT: "true"
          REVIEW_GATE_WORKFLOW_FILE: review-gate.yml
          REVIEW_EVENT_SENSOR_WORKFLOW_FILE: review-gate.yml
          REVIEW_EVENT_RECEIVER_WORKFLOW_FILE: review-gate-capture-completion.yml
          SECURITY_REVIEW_BOT_LOGIN: chatgpt-codex-connector
          SECURITY_REVIEW_BOT_EVENT_LOGIN: chatgpt-codex-connector[bot]
          EVENT_PR_NUMBER: ${{ matrix.pr_number }}
        shell: bash
        run: |
          export GITHUB_EVENT_NAME=workflow_dispatch INPUT_PR="$EVENT_PR_NUMBER"
          bash "$CANONICAL_REVIEW_GATE"
      - name: Remove canonical policy temporary file
        if: always()
        env:
          POLICY_PATH: ${{ steps.canonical.outputs.path }}
          RECEIPT_PATH: ${{ steps.canonical.outputs.receipt_path }}
        shell: bash
        run: |
          if [[ -n "$POLICY_PATH" ]]; then rm -f -- "$POLICY_PATH" "$POLICY_PATH.dependencies.py" "$POLICY_PATH.review-sections.py"; fi
          if [[ -n "$RECEIPT_PATH" ]]; then rm -f -- "$RECEIPT_PATH"; fi
