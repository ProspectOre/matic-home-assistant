name: Windows assistive qualification (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-assistive-qualification:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Run bounded Windows AT experiment
        shell: pwsh
        run: ./scripts/qualify_windows_accessibility.ps1
