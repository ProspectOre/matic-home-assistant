name: Browser UI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # The browser suite loads the committed bundle, so a source-only edit
      # would pass every check while shipping the previous UI. Rebuild and fail
      # if the result differs from what is committed.
      - run: npm run build:map-studio-v4
      - name: Committed bundle matches the frontend source
        run: |
          if ! git diff --exit-code -- custom_components/matic_robot/map_studio_v4/; then
            echo "::error::The committed Map Studio bundle is stale. Run 'npm run build:map-studio-v4' and commit the result." >&2
            exit 1
          fi
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:browser
