# Generated trusted receiver; edit scripts/review-gate/receiver.yml in ProspectOre/dev-workspace.
name: Capture Authenticated Review Events
on:
  workflow_run:
    workflows: [Route Regular Codex Review Events]
    types: [requested, completed]
permissions:
  actions: write
  contents: read
  issues: read
  pull-requests: write
  statuses: write
concurrency:
  group: review-event-${{ github.event.workflow_run.id }}
  cancel-in-progress: false
jobs:
  receive:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Load and run the trusted event receiver
        env:
          GH_TOKEN: ${{ github.token }}
          POLICY_REF: ${{ github.workflow_sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}

        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_WORKFLOW_REF" == "$GITHUB_REPOSITORY/.github/workflows/review-event-receiver.yml@refs/heads/$DEFAULT_BRANCH" ]] || exit 1
          [[ "$POLICY_REF" =~ ^[0-9a-f]{40}$ ]] || exit 1
          directory="$(mktemp -d "$RUNNER_TEMP/review-receiver.XXXXXX")"
          trap 'rm -rf "$directory"' EXIT
          while read -r name expected; do
            gh api -H 'Accept: application/vnd.github.raw+json' \
              "repos/$GITHUB_REPOSITORY/contents/.github/review-gate/$name?ref=$POLICY_REF" > "$directory/$name"
            actual="$(sha256sum "$directory/$name")"
            [[ "${actual%% *}" == "$expected" ]] || exit 1
            chmod 400 "$directory/$name"
          done <<'FILES'
          evaluate.sh cf55b6465d528aaed519ba4eec61760aed1897154ea6b5b373571b3a2814d0ce
          event_relay.py cd79db46c17508f7f32397f42884a947170777b8c39e2271fde617b12f3ad9d0
          receive_event.py dce721760725859e7e766c4c26f25e164cd7646ff71f7382453e735f9e7d3b28
          FILES
          export CANONICAL_REVIEW_GATE="$directory/evaluate.sh"
          python3 "$directory/receive_event.py"
