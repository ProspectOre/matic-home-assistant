# Generated adapter; edit scripts/review-gate/adapters in ProspectOre/dev-workspace.
name: Regular Review Gate

run-name: "${{ inputs.review_capture_id != '' && format('Review gate PR #{0} | policy-workflow-sha={1} | event-capture={2} | event-head={3} | event-history-head={4}', inputs.pull_request, github.workflow_sha, inputs.review_capture_id, fromJSON(inputs.review_event).pull_request.head.sha, fromJSON(inputs.review_event).review.commit_id || fromJSON(inputs.review_event).comment.original_commit_id) || format('Review gate PR #{0} | policy-workflow-sha={1}', github.event.pull_request.number || github.event.issue.number || inputs.pull_request || 'unknown', github.workflow_sha) }}"

on:
  pull_request_target:
    # Repository-level auto-merge is disabled; this event is defense in depth
    # if that administrative policy ever drifts.
    types: [opened, reopened, synchronize, ready_for_review, auto_merge_enabled, edited]
  issue_comment:
    types: [created, edited, deleted]
  workflow_dispatch:
    inputs:
      pull_request:
        description: Pull request number
        required: true
        type: string
      audit:
        description: Reconcile the current state after a captured review event
        required: false
        default: false
        type: boolean
      review_event_name:
        description: Signed review webhook event name
        required: false
        type: string
      review_event:
        description: Bounded signed review event envelope
        required: false
        type: string
      review_capture_id:
        description: Numeric receipt ID derived from the signed delivery UUID
        required: false
        type: string
      review_event_delivery_id:
        description: Signed review webhook delivery UUID
        required: false
        type: string
      review_event_signature:
        description: HMAC signature over the signed review envelope
        required: false
        type: string

# Keep workflow runs alive so synchronize observations can be recorded even if
# a later PR event supersedes their evaluation job.
concurrency:
  group: ${{ format('review-gate-workflow-{0}', github.run_id) }}
  cancel-in-progress: false

permissions:
  actions: write
  contents: read
  issues: read
  pull-requests: write
  statuses: write

jobs:
  observe-head:
    name: "observe-head PR #${{ github.event.pull_request.number }} | head=${{ github.event.pull_request.head.sha }} | at=${{ github.event.pull_request.updated_at }}"
    if: github.event_name == 'pull_request_target' && github.event.action == 'synchronize'
    concurrency:
      group: ${{ format('review-head-observation-{0}', github.event.pull_request.number) }}
      cancel-in-progress: false
    runs-on: ${{ vars.USE_HOSTED_RUNNERS != 'false' && vars.USE_HOSTED_LINUX != 'false' && 'ubuntu-latest' || fromJSON('["self-hosted","macOS","ARM64","mbp"]') }}
    steps:
      - name: Record authenticated synchronize event
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT_ACTION: ${{ github.event.action }}
          EVENT_PR_NUMBER: ${{ github.event.pull_request.number }}
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          export PATH="/opt/homebrew/bin:/usr/local/bin:$PATH"
          [[ "$GITHUB_EVENT_NAME" == pull_request_target
            && "$EVENT_ACTION" == synchronize
            && "$EVENT_PR_NUMBER" =~ ^[1-9][0-9]*$
            && "$EVENT_HEAD_SHA" =~ ^[0-9a-f]{40}$
            && "$GITHUB_RUN_ID" =~ ^[1-9][0-9]*$ ]] || exit 1
          observed_at="$(jq -er --arg head "$EVENT_HEAD_SHA" --argjson pr "$EVENT_PR_NUMBER" '
            select(.action == "synchronize"
              and .pull_request.number == $pr
              and .pull_request.head.sha == $head)
            | .pull_request.updated_at
            | select(type == "string"
              and test("^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(\\.[0-9]+)?Z$"))
          ' "$GITHUB_EVENT_PATH")"
          gh api "repos/$REPO/statuses/$EVENT_HEAD_SHA" --silent \
            -f state=success \
            -f context="review-head-observation/pr-$EVENT_PR_NUMBER" \
            -f description="Trusted head observation PR #$EVENT_PR_NUMBER head $EVENT_HEAD_SHA at $observed_at" \
            -f target_url="${GITHUB_SERVER_URL:-https://github.com}/$REPO/actions/runs/$GITHUB_RUN_ID"

  evaluate:
    name: "evaluate-review PR #${{ github.event.pull_request.number || github.event.issue.number || inputs.pull_request || 'unknown' }} | policy-workflow-sha=${{ github.workflow_sha }}"
    # Synchronize evaluation waits for its durable observation. Other event
    # runs skip their observer and re-use observations from completed runs.
    needs: observe-head
    if: >-
      always()
      && (
        github.event_name == 'workflow_dispatch'
        || github.event.pull_request.number != null
        || (github.event.issue.pull_request != null
          && github.event.comment.user.login == 'chatgpt-codex-connector[bot]'
          && github.event.comment.user.id == 199175422
          && github.event.comment.user.type == 'Bot')
      )
    concurrency:
      group: ${{ inputs.audit == true && format('review-gate-audit-{0}', inputs.pull_request) || (inputs.review_capture_id != '' || github.event_name == 'issue_comment') && format('review-gate-event-{0}', github.run_id) || format('review-gate-{0}', github.event.pull_request.number || inputs.pull_request || github.ref) }}
      cancel-in-progress: ${{ inputs.audit == true || (inputs.review_capture_id == '' && github.event_name != 'issue_comment') }}
    runs-on: ${{ vars.USE_HOSTED_RUNNERS != 'false' && vars.USE_HOSTED_LINUX != 'false' && 'ubuntu-latest' || fromJSON('["self-hosted","macOS","ARM64","mbp"]') }}
    environment: review-event-relay
    steps:
      - id: review-sections
        if: github.event_name == 'issue_comment'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT_PR: ${{ github.event.issue.number }}
          POLICY_REF: ${{ github.workflow_sha }}
          EXPECTED_REVIEW_SECTIONS_SHA256: '27a45240800c41400e7e82cd0a8b453377f6f9b3b02f49eb27a6e16cc45a598b'
        shell: bash
        run: |
          set -euo pipefail
          export PATH="/opt/homebrew/bin:/usr/local/bin:$PATH"
          # Human @codex review comments are an authorized request for a new
          # run. They must remain mutation-free, including when the canonical
          # parser cannot be loaded.
          if ! jq -e '
            .comment.user.id == 199175422 and .comment.user.login == "chatgpt-codex-connector[bot]"
            and .comment.user.type == "Bot"
          ' "$GITHUB_EVENT_PATH" >/dev/null 2>&1; then
            echo "Manual review request; canonical parser not needed."
            exit 0
          fi
          [[ "$REPO" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]
          [[ "$EVENT_PR" =~ ^[1-9][0-9]*$ ]]
          [[ "$POLICY_REF" =~ ^[0-9a-f]{40}$ ]]
          write_pending_gate_status() {
            local target_head="$1" description="$2" attempt
            for attempt in 1 2 3; do
              if gh api "repos/$REPO/statuses/$target_head" --silent \
                -f state=pending -f context=review-gate \
                -f description="$description" \
                -f target_url="$GITHUB_SERVER_URL/$REPO/actions/runs/$GITHUB_RUN_ID"; then
                return 0
              fi
              if [[ "$attempt" -lt 3 ]]; then sleep "$attempt"; fi
            done
            echo "Unable to publish pending review-gate status on $target_head after three attempts." >&2
            return 1
          }
          hold_unverified_footer_association() {
            if [[ -z "$live_head" ]]; then
              if resolve_live_pr_head; then
                write_pending_gate_status "$live_head" \
                  "Recording unverified connector review delivery for PR #$EVENT_PR" || exit 1
              else
                echo "Could not verify connector commit association or resolve a safe live PR status target." >&2
                exit 1
              fi
            fi
            echo "Could not verify connector commit association; live PR head $live_head remains pending." >&2
            exit 1
          }
          # The connector footer supplies only a pending hint. Resolve the
          # normal ten-character abbreviation uniquely, then prove its full
          # OID belongs to this PR before classification. Neither form supplies
          # a qualified review verdict.
          comment_heads="$(jq -r --arg pr "$EVENT_PR" '
            select(.issue.pull_request != null and (.issue.number | tostring) == $pr)
            | [.comment.body // "", .changes.body.from // ""]
            | [.[] | select(type == "string")
              | scan("(?im)^[ ]{0,3}[*]{0,2}reviewed commit:[*]{0,2}[ \\t]*\\x60([0-9a-f]{40}|[0-9a-f]{10})\\x60[ \\t]*\\r?$")
              | .[0] | ascii_downcase] | unique[]' "$GITHUB_EVENT_PATH")"
          resolve_live_pr_head() {
            local attempt pr_snapshot resolved_head
            for attempt in 1 2 3; do
              if pr_snapshot="$(gh api "repos/$REPO/pulls/$EVENT_PR")" \
                  && resolved_head="$(jq -er '.head.sha | select(type == "string" and test("^[0-9a-f]{40}$"))' <<< "$pr_snapshot")" \
                  && [[ "$resolved_head" =~ ^[0-9a-f]{40}$ ]]; then
                live_head="$resolved_head"
                return 0
              fi
              resolved_head=""
              [[ "$attempt" != 3 ]] || break
              sleep "$attempt"
            done
            live_head=""
            return 1
          }
          live_head=""
          resolve_live_pr_head || true
          # Hold the actual PR candidate before the fallible footer association
          # lookup, which may refer to an older commit or return malformed data.
          if [[ -n "$live_head" ]]; then
            write_pending_gate_status "$live_head" \
              "Recording connector review delivery for PR #$EVENT_PR" || exit 1
          fi
          while IFS= read -r comment_head; do
            [[ "$comment_head" =~ ^([0-9a-f]{40}|[0-9a-f]{10})$ ]] || continue
            if [[ "${#comment_head}" == 10 ]]; then
              comment_prefix="$comment_head"
              if ! comment_head="$(gh api "repos/$REPO/commits/$comment_prefix" \
                  --jq '.sha | select(type == "string" and test("^[0-9a-f]{40}$"))')" \
                  || [[ ! "$comment_head" =~ ^[0-9a-f]{40}$ \
                    || "${comment_head:0:10}" != "$comment_prefix" ]]; then
                hold_unverified_footer_association
              fi
            fi
            # If GitHub cannot resolve the live PR, revoke any exact-head
            # success named by this authenticated connector delivery before
            # the fallible association lookup. This is pending-only evidence;
            # the footer still cannot classify or qualify the review.
            if [[ -z "$live_head" ]]; then
              write_pending_gate_status "$comment_head" \
                "Recording unverified connector review delivery for PR #$EVENT_PR" || true
              # A failed hint must not prevent association from recovering and
              # strictly holding the actual live head before historical writes.
            fi
            if ! association_pages="$(gh api "repos/$REPO/commits/$comment_head/pulls?per_page=100" \
                --paginate --slurp)"; then
              hold_unverified_footer_association
            fi
            if ! association_result="$(jq -r --arg repo "$REPO" --argjson pr "$EVENT_PR" '
                if type != "array" or any(.[]; type != "array") then
                  error("Invalid commit-associated PR pages")
                elif any(.[][]; type != "object" or (.number | type != "number")
                    or (.base.repo.full_name | type != "string")) then
                  error("Invalid commit-associated PR entry")
                else
                  [.[][] | select(.number == $pr and .base.repo.full_name == $repo)
                    | .head.sha] as $heads
                  | if ($heads | length) == 0 then
                      "not-associated"
                    elif any($heads[]; if type == "string" then
                        (test("^[0-9a-f]{40}$") | not)
                      else true end) then
                      error("Invalid associated pull-request head")
                    elif ($heads | unique | length) != 1 then
                      error("Conflicting associated pull-request heads")
                    else
                      "associated\t" + $heads[0]
                    end
                end' <<< "$association_pages")"; then
              hold_unverified_footer_association
            fi
            case "$association_result" in
              associated$'\t'* )
                associated_head="${association_result#*$'\t'}"
                [[ "$associated_head" =~ ^[0-9a-f]{40}$ ]] || hold_unverified_footer_association
                # The commit-association response includes the PR's current
                # head. If the direct PR read was transiently unavailable,
                # use this independently validated full OID to hold that
                # candidate before classifying an older footer.
                if [[ -z "$live_head" || "$live_head" != "$associated_head" ]]; then
                  live_head="$associated_head"
                  if [[ "$comment_head" != "$associated_head" ]]; then
                    write_pending_gate_status "$live_head" \
                      "Recording connector review delivery for PR #$EVENT_PR" || exit 1
                  fi
                fi
                write_pending_gate_status "$comment_head" \
                  "Bound connector delivery pending classification for PR #$EVENT_PR" || exit 1
                ;;
              not-associated) ;;
              *) hold_unverified_footer_association ;;
            esac
          done <<< "$comment_heads"
          if [[ -z "$live_head" ]]; then
            resolve_live_pr_head || exit 1
            write_pending_gate_status "$live_head" \
              "Recording connector review delivery for PR #$EVENT_PR" || exit 1
          fi
          fail_closed_load() {
            local reason="$1"
            write_pending_gate_status "$live_head" \
              "Canonical review-section classifier $reason for PR #$EVENT_PR" || exit 1
            echo "Canonical review-section classifier $reason; gate held on live PR head $live_head." >&2
            exit 1
          }
          if ! sections_path="$(mktemp "${RUNNER_TEMP:-${TMPDIR:-/tmp}}/review-sections.XXXXXX")"; then
            fail_closed_load "temporary file creation failed"
          fi
          if ! gh api -H 'Accept: application/vnd.github.raw+json' \
            "repos/$REPO/contents/.github/review-gate/review_sections.py?ref=$POLICY_REF" > "$sections_path"; then
            fail_closed_load "download failed"
          fi
          if ! actual="$(shasum -a 256 "$sections_path")" ||
             [[ "${actual%% *}" != "$EXPECTED_REVIEW_SECTIONS_SHA256" ]]; then
            fail_closed_load "hash verification failed"
          fi
          chmod 400 "$sections_path"
          echo "path=$sections_path" >> "$GITHUB_OUTPUT"
      - id: begin-native-event
        if: github.event_name == 'issue_comment'
        env:
          EVENT_HEAD: ${{ github.event.pull_request.head.sha }}
          EVENT_PR: ${{ github.event.pull_request.number || github.event.issue.number }}
          EVENT_ACTION: ${{ github.event.action }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          REVIEW_SECTIONS_SCRIPT: ${{ steps.review-sections.outputs.path }}
        shell: bash
        run: |
          set -euo pipefail
          export PATH="/opt/homebrew/bin:/usr/local/bin:$PATH"
          [[ "$EVENT_PR" =~ ^[1-9][0-9]*$ ]] || exit 1
          discover_live_head() {
            local pr_snapshot attempt
            live_head=""
            for attempt in 1 2 3; do
              if pr_snapshot="$(gh api "repos/$REPO/pulls/$EVENT_PR")" \
                  && live_head="$(jq -er '.head.sha | select(type == "string" and test("^[0-9a-f]{40}$"))' <<< "$pr_snapshot")" \
                  && [[ "$live_head" =~ ^[0-9a-f]{40}$ ]]; then
                return 0
              fi
              live_head=""
              if [[ "$attempt" == 3 ]]; then
                echo "Unable to discover a valid live PR head after three attempts." >&2
                return 1
              fi
              sleep "$attempt"
            done
          }
          # Human @codex review comments are authorized triggers, not Codex
          # review receipts. Do not create an acknowledgement that a later
          # evaluator could accidentally attach to a newer PR head.
          if ! jq -e '
            .comment.user.id == 199175422 and .comment.user.login == "chatgpt-codex-connector[bot]"
            and .comment.user.type == "Bot"
          ' "$GITHUB_EVENT_PATH" >/dev/null 2>&1; then
            echo "Manual review request; no native connector receipt is needed."
            exit 0
          fi
          event_head=""
          if [[ "$EVENT_ACTION" == created || "$EVENT_ACTION" == edited || "$EVENT_ACTION" == deleted ]] && jq -e '
            .comment.user.id == 199175422 and .comment.user.login == "chatgpt-codex-connector[bot]"
            and .comment.user.type == "Bot"
          ' "$GITHUB_EVENT_PATH" >/dev/null 2>&1; then
            issue_comment_facts="$(python3 "$REVIEW_SECTIONS_SCRIPT" "$GITHUB_EVENT_PATH")" || {
              echo "The canonical review-section classifier could not classify this event." >&2
              exit 1
            }
            current_review_refs="$(jq -r '
              ([.current.sections[]? | select(.has_result and .parser_ambiguous != true and .target_ref != "__unbound__")
                | .target_ref]
               + (if .current.request_head then [.current.request_head] else [] end))
              | unique[]' <<< "$issue_comment_facts")"
            prior_review_refs="$(jq -r '
              ([.previous.sections[]? | select(.has_result and .parser_ambiguous != true and .target_ref != "__unbound__")
                | .target_ref]
               + (if .previous.request_head then [.previous.request_head] else [] end))
              | unique[]' <<< "$issue_comment_facts")"
            current_unbound_regular="$(jq -r '
              any(.current.sections[]?; .parser_ambiguous or (.regular_adverse and .target_ref == "__unbound__"))' <<< "$issue_comment_facts")"
            prior_unbound_regular="$(jq -r '
              any(.previous.sections[]?; .parser_ambiguous or (.regular_adverse and .target_ref == "__unbound__"))' <<< "$issue_comment_facts")"
            write_pending_gate_status() {
              local target_head="$1" description="$2" attempt
              for attempt in 1 2 3; do
                if gh api "repos/$REPO/statuses/$target_head" --silent \
                  -f state=pending -f context=review-gate \
                  -f description="$description" \
                  -f target_url="$GITHUB_SERVER_URL/$REPO/actions/runs/$GITHUB_RUN_ID"; then
                  return 0
                fi
                if [[ "$attempt" -lt 3 ]]; then sleep "$attempt"; fi
              done
              echo "Unable to publish pending review-gate status on $target_head after three attempts." >&2
              return 1
            }
            pending_security_uncertainty() {
              local live_head
              discover_live_head || exit 1
              gh api "repos/$REPO/statuses/$live_head" --silent \
                -f state=pending -f context="review-native-event/$GITHUB_RUN_ID" \
                -f description="Unbound security review event for PR #$EVENT_PR" \
                -f target_url="$GITHUB_SERVER_URL/$REPO/actions/runs/$GITHUB_RUN_ID" || true
              write_pending_gate_status "$live_head" \
                "Security review event head is unbound; gate held for PR #$EVENT_PR" || exit 1
              echo "Potentially adverse security review event has no authenticated reviewed commit." >&2
              exit 1
            }
            pending_regular_uncertainty() {
              local live_head
              discover_live_head || exit 1
              gh api "repos/$REPO/statuses/$live_head" --silent \
                -f state=pending -f context="review-native-event/$GITHUB_RUN_ID" \
                -f description="Unbound regular review event for PR #$EVENT_PR" \
                -f target_url="$GITHUB_SERVER_URL/$REPO/actions/runs/$GITHUB_RUN_ID" || true
              write_pending_gate_status "$live_head" \
                "Regular review event head is unbound; gate held for PR #$EVENT_PR" || exit 1
              echo "Potentially adverse regular review event has no authenticated reviewed commit." >&2
              exit 1
            }
            # The canonical parser classifies each current and prior result
            # section independently.  Any adverse section without a unique
            # target remains an uncertainty barrier; neutral quota and summary
            # sections remain eligible for the no-receipt path below.
            if [[ "$current_unbound_regular" == true || "$prior_unbound_regular" == true ]]; then
              pending_regular_uncertainty
            fi
            security_event_flags="$(jq -c '
              {
                current_adverse: any(.current.sections[]?; .security_finding and .parser_ambiguous != true),
                prior_adverse: any(.previous.sections[]?; .security_finding and .parser_ambiguous != true),
                current_unbound: any(.current.sections[]?; .security_finding and .parser_ambiguous != true and .target_ref == "__unbound__"),
                prior_unbound: any(.previous.sections[]?; .security_finding and .parser_ambiguous != true and .target_ref == "__unbound__")
              }
            ' <<< "$issue_comment_facts")"
            if jq -e '.current_unbound or .prior_unbound' <<< "$security_event_flags" >/dev/null; then
              pending_security_uncertainty
            fi
            security_report_suffix_pattern='(?is)\[view security finding report\]\([^\r\n)]+\)(?:[ \t]*(?:\r?\n[ \t]*)+_only the user who started this review can view the report in codex\._)?(?:[ \t]*(?:\r?\n[ \t]*)+<details>[ \t]*<summary>(?:ℹ️ )?about codex security reviews in github</summary>[\s\S]*?</details>)?[ \t]*$'
            malformed_security_report="$(jq -r --arg pattern "$security_report_suffix_pattern" '
              any(.current.sections[]?;
                  .security_event and (.body | test("(?i)\\[view security finding report\\]\\("))
                  and ((.body | test($pattern)) | not))
              or any(.previous.sections[]?;
                  .security_event and (.body | test("(?i)\\[view security finding report\\]\\("))
                  and ((.body | test($pattern)) | not))
            ' <<< "$issue_comment_facts")"
            if [[ "$malformed_security_report" == true ]]; then
              pending_security_uncertainty
            fi
            # Quota, summary, and other nonfinding comments without a bound
            # reviewed commit are neutral. Do not create a receipt for them.
            if [[ -z "$current_review_refs" && -z "$prior_review_refs" ]]; then
              echo "Review event has no authenticated reviewed commit; no receipt recorded."
              echo "neutral=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            discover_live_head || exit 1
            commit_associated_with_event_pr() {
              local target_sha="$1" associated history
              [[ "$target_sha" =~ ^[0-9a-f]{40}$ ]] || return 1
              [[ "$target_sha" == "$live_head" ]] && return 0
              associated="$(gh api "repos/$REPO/commits/$target_sha/pulls?per_page=100" --paginate --slurp \
                | jq -er --arg repo "$REPO" --argjson pr "$EVENT_PR" '
                    if type != "array" or any(.[]; type != "array") then
                      error("Invalid commit-associated PR pages")
                    elif any(.[][]; .number == $pr and .base.repo.full_name == $repo) then "associated"
                    elif ([.[][]] | length) == 0 then "empty"
                    else "foreign" end')" || return 1
              [[ "$associated" != associated ]] || return 0
              [[ "$associated" == empty || "$associated" == foreign ]] || return 1
              # Immutable force-push refs can outlive the commit-to-PR association.
              # GraphQL variables are evaluated by the server.
              # shellcheck disable=SC2016
              history="$(gh api graphql --paginate --slurp \
                -f owner="${REPO%%/*}" -f name="${REPO#*/}" -F pr="$EVENT_PR" \
                -f query='query($owner:String!, $name:String!, $pr:Int!, $endCursor:String) {
                  repository(owner:$owner,name:$name) { nameWithOwner pullRequest(number:$pr) {
                    number timelineItems(first:100,after:$endCursor,itemTypes:[HEAD_REF_FORCE_PUSHED_EVENT]) {
                      nodes { __typename ... on HeadRefForcePushedEvent { beforeCommit { oid } afterCommit { oid } } }
                      pageInfo { hasNextPage endCursor }
                    }
                  } }
                }')" || return 1
              jq -e --arg repo "$REPO" --argjson pr "$EVENT_PR" --arg sha "$target_sha" '
                if type != "array" or length == 0 then error("Missing force-push history") else
                  if any(.[]; ((.errors // []) | length) != 0
                      or .data.repository.nameWithOwner != $repo
                      or .data.repository.pullRequest.number != $pr) then error("Foreign force-push history") else
                    [.[] | .data.repository.pullRequest.timelineItems] as $pages
                    | if any($pages[]; (.nodes | type) != "array"
                        or (.pageInfo.hasNextPage | type) != "boolean"
                        or (.pageInfo.hasNextPage and ((.pageInfo.endCursor | type) != "string"))
                        or any(.nodes[]; .__typename != "HeadRefForcePushedEvent"
                          or ((.beforeCommit.oid | type) != "string") or ((.afterCommit.oid | type) != "string")
                          or ((.beforeCommit.oid | test("^[0-9a-f]{40}$")) | not)
                          or ((.afterCommit.oid | test("^[0-9a-f]{40}$")) | not)))
                      or $pages[-1].pageInfo.hasNextPage != false
                      or any($pages[:-1][]; .pageInfo.hasNextPage != true)
                      or (([$pages[] | select(.pageInfo.hasNextPage) | .pageInfo.endCursor] | unique | length)
                        != ([$pages[] | select(.pageInfo.hasNextPage)] | length))
                      then error("Incomplete or invalid force-push history")
                      else any($pages[].nodes[]; .beforeCommit.oid == $sha or .afterCommit.oid == $sha) end
                  end
                end' <<< "$history" >/dev/null
            }
            resolve_review_refs() {
              local refs="$1" resolved_refs="" event_ref resolved_ref unique_refs
              while IFS= read -r event_ref; do
                [[ "$event_ref" =~ ^[0-9a-f]{10}([0-9a-f]{30})?$ ]] || return 1
                resolved_ref="$(gh api "repos/$REPO/commits/$event_ref" --jq '.sha')" || return 1
                [[ "$resolved_ref" =~ ^[0-9a-f]{40}$ && "$resolved_ref" == "$event_ref"* ]] || return 1
                commit_associated_with_event_pr "$resolved_ref" || return 1
                resolved_refs+="$resolved_ref"$'\n'
              done <<< "$refs"
              # A single comment may contain several independently rendered
              # result sections (for example a current regular review and a
              # historical security report).  Validate every referenced
              # commit, but do not collapse the sections into a false
              # whole-body single-head requirement.  The coordinator marker,
              # when present, remains the receipt owner below.
              unique_refs="$(jq -nr --arg refs "$resolved_refs" \
                '$refs | split("\n") | map(select(length > 0)) | unique | .[]')" || return 1
              [[ -n "$unique_refs" ]] || return 1
              printf '%s' "$unique_refs"
            }
            coordinator_receipt_owner() {
              local scope="${2:-current}"
              jq -r --arg scope "$scope" '.[$scope].request_head // empty' <<< "$1"
            }
            current_event_head=""
            prior_event_head=""
            current_resolved_refs=""
            prior_resolved_refs=""
            if [[ -n "$current_review_refs" ]]; then
              current_resolved_refs="$(resolve_review_refs "$current_review_refs")" || {
                write_pending_gate_status "$live_head" \
                  "Ambiguous review event references; gate held for PR #$EVENT_PR" || exit 1
                echo "Review event references do not resolve to associated PR commits." >&2
                exit 1
              }
              current_event_head="$(coordinator_receipt_owner "$issue_comment_facts" current)"
              if [[ -n "$current_event_head" ]] && ! grep -Fqx "$current_event_head" <<< "$current_resolved_refs"; then
                write_pending_gate_status "$live_head" \
                  "Coordinator head is not an authenticated reviewed commit; gate held for PR #$EVENT_PR" || exit 1
                exit 1
              fi
              [[ -n "$current_event_head" ]] || current_event_head="$(sed -n '1p' <<< "$current_resolved_refs")"
            fi
            if [[ -n "$prior_review_refs" ]]; then
              prior_resolved_refs="$(resolve_review_refs "$prior_review_refs")" || {
                write_pending_gate_status "$live_head" \
                  "Ambiguous prior review event references; gate held for PR #$EVENT_PR" || exit 1
                echo "Prior review event references do not resolve to associated PR commits." >&2
                exit 1
              }
              prior_event_head="$(coordinator_receipt_owner "$issue_comment_facts" previous)"
              if [[ -n "$prior_event_head" ]] && ! grep -Fqx "$prior_event_head" <<< "$prior_resolved_refs"; then
                write_pending_gate_status "$live_head" \
                  "Prior coordinator head is not an authenticated reviewed commit; gate held for PR #$EVENT_PR" || exit 1
                exit 1
              fi
              [[ -n "$prior_event_head" ]] || prior_event_head="$(sed -n '1p' <<< "$prior_resolved_refs")"
            fi
            review_head="$current_event_head"
            if [[ "$EVENT_ACTION" == edited && -n "$prior_review_refs" ]]; then
              # Revoke a retargeted current head before processing the prior
              # body, then let that prior head own the event receipt/history.
              if [[ -n "$current_event_head" ]]; then
                write_pending_gate_status "$current_event_head" \
                  "Edited review event also references current commit for PR #$EVENT_PR" || exit 1
              fi
              review_head="$prior_event_head"
            elif [[ -z "$review_head" ]]; then
              review_head="$prior_event_head"
            fi
            if jq -e \
              --arg current_head "$current_event_head" \
              --arg prior_head "$prior_event_head" \
              --arg review_head "$review_head" '
              (.current_adverse and (($current_head | length) == 0 or $current_head != $review_head)) or
              (.prior_adverse and (($prior_head | length) == 0 or $prior_head != $review_head))
            ' <<< "$security_event_flags" >/dev/null; then
              pending_security_uncertainty
            fi
            cross_head_comment_id="$(jq -r '.comment.id // empty' "$GITHUB_EVENT_PATH")"
            if [[ "$current_event_head" =~ ^[0-9a-f]{40}$ && "$review_head" =~ ^[0-9a-f]{40}$ && "$current_event_head" != "$review_head" && "$cross_head_comment_id" =~ ^[1-9][0-9]*$ ]] && jq -e \
              --arg head "$current_event_head" --arg prefix "${current_event_head:0:10}" '
              any(.current.sections[]?;
                  .regular_adverse and .parser_ambiguous != true
                  and (.target_ref == $head or .target_ref == $prefix))
            ' <<< "$issue_comment_facts" >/dev/null; then
              regular_history_description="Regular findings observed for PR #$EVENT_PR on head $current_event_head; issue-comment:$cross_head_comment_id; event:captured"
              if (( ${#regular_history_description} > 140 )); then
                regular_history_description="Regular findings${regular_history_description#Regular findings observed}"
              fi
              if (( ${#regular_history_description} > 140 )); then
                echo "A finding-history status description exceeded GitHub's 140-character limit." >&2
                exit 1
              fi
              gh api "repos/$REPO/statuses/$current_event_head" --silent \
                -f state=pending -f context=review-finding-history \
                -f description="$regular_history_description" \
                -f target_url="$GITHUB_SERVER_URL/$REPO/actions/runs/$GITHUB_RUN_ID"
            fi
            if [[ -n "$review_head" ]]; then
              event_head="$review_head"
              if ! gh api "repos/$REPO/statuses/$review_head" --silent \
                  -f state=pending -f context="review-native-event/$GITHUB_RUN_ID" \
                  -f description="Review event $GITHUB_RUN_ID for PR #$EVENT_PR" \
                  -f target_url="$GITHUB_SERVER_URL/$REPO/actions/runs/$GITHUB_RUN_ID"; then
                  write_pending_gate_status "$review_head" \
                    "Native review event receipt failed for PR #$EVENT_PR" || exit 1
                exit 1
              fi
              write_pending_gate_status "$review_head" \
                "Recording a native review event for PR #$EVENT_PR" || exit 1
            fi
          fi
          [[ "$event_head" =~ ^[0-9a-f]{40}$ ]] || exit 0
          discover_live_head || exit 1
          if [[ "$event_head" != "$live_head" ]]; then echo "historical=true" >> "$GITHUB_OUTPUT"; fi
          [[ "$EVENT_PR" =~ ^[1-9][0-9]*$ && "$event_head" =~ ^[0-9a-f]{40}$ ]] || exit 1
          EVENT_HEAD="$event_head"
          receipt_heads="$current_resolved_refs"
          [[ -n "$receipt_heads" ]] || receipt_heads="$EVENT_HEAD"
          if [[ "$EVENT_ACTION" == created || "$EVENT_ACTION" == edited ]] && jq -e '
            .comment.user.id == 199175422 and .comment.user.login == "chatgpt-codex-connector[bot]"
            and .comment.user.type == "Bot" and (.comment.id | type == "number" and . > 0)
            and (.comment.body | type == "string")
          ' "$GITHUB_EVENT_PATH" >/dev/null; then
            comment_id="$(jq -er '.comment.id | select(type == "number" and . > 0 and floor == .)' "$GITHUB_EVENT_PATH")"
            body_sha="$(jq -rj '.comment.body' "$GITHUB_EVENT_PATH" | shasum -a 256 | awk '{print $1}')"
            comment_updated_at="$(jq -er '.comment.updated_at | select(type == "string" and test("^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$"))' "$GITHUB_EVENT_PATH")"
            [[ "$body_sha" =~ ^[0-9a-f]{64}$ ]] || exit 1
          fi
          if ! gh api "repos/$REPO/statuses/$EVENT_HEAD" --silent \
            -f state=pending -f context="review-native-event/$GITHUB_RUN_ID" \
            -f description="Review event $GITHUB_RUN_ID for PR #$EVENT_PR" \
            -f target_url="$GITHUB_SERVER_URL/$REPO/actions/runs/$GITHUB_RUN_ID"; then
            write_pending_gate_status "$EVENT_HEAD" \
              "Native review event receipt failed for PR #$EVENT_PR" || exit 1
            exit 1
          fi
          write_pending_gate_status "$EVENT_HEAD" \
            "Recording a native review event for PR #$EVENT_PR" || exit 1
          if [[ -n "${comment_id:-}" ]]; then
            while IFS= read -r receipt_head; do
              [[ -n "$receipt_head" ]] || continue
              if ! gh api "repos/$REPO/statuses/$receipt_head" --silent \
                -f state=success -f context="review-clean-comment/$comment_id/$GITHUB_RUN_ID/$GITHUB_RUN_ATTEMPT" \
                -f description="body-sha256:$body_sha; updated-at:$comment_updated_at; action:$EVENT_ACTION" \
                -f target_url="$GITHUB_SERVER_URL/$REPO/actions/runs/$GITHUB_RUN_ID"; then
                write_pending_gate_status "$EVENT_HEAD" \
                  "Clean review comment receipt failed for PR #$EVENT_PR" || exit 1
                exit 1
              fi
              echo "Review comment receipt $comment_id recorded for PR #$EVENT_PR: body-sha256:$body_sha; updated-at:$comment_updated_at; action:$EVENT_ACTION; head:$receipt_head"
            done <<< "$receipt_heads"
          fi
          echo "id=$GITHUB_RUN_ID" >> "$GITHUB_OUTPUT"
          echo "head=$EVENT_HEAD" >> "$GITHUB_OUTPUT"
      - id: signal-relay-event
        if: >-
          inputs.review_capture_id != '' || inputs.review_event_name != '' ||
          inputs.review_event != '' || inputs.review_event_delivery_id != '' ||
          inputs.review_event_signature != ''
        env:
          TARGET_PR: ${{ inputs.pull_request || github.event.pull_request.number || github.event.issue.number }}
          FORWARDED_EVENT_NAME: ${{ inputs.review_event_name }}
          FORWARDED_EVENT: ${{ inputs.review_event }}
          FORWARDED_EVENT_DELIVERY_ID: ${{ inputs.review_event_delivery_id }}
          FORWARDED_EVENT_SIGNATURE: ${{ inputs.review_event_signature }}
          REVIEW_CAPTURE_ID: ${{ inputs.review_capture_id }}
          REVIEW_EVENT_RELAY_SECRET: ${{ secrets.REVIEW_EVENT_RELAY_SECRET }}
          EXPECTED_REPO: ${{ github.repository }}
          EXPECTED_REPO_ID: ${{ github.event.repository.id }}
          EXPECTED_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          export PATH="/opt/homebrew/bin:/usr/local/bin:$PATH"
          [[ "$TARGET_PR" =~ ^[1-9][0-9]*$ ]] || exit 1
          [[ "$REVIEW_CAPTURE_ID" =~ ^[1-9][0-9]*$ ]] || exit 1
          [[ "$FORWARDED_EVENT_NAME" == pull_request_review || "$FORWARDED_EVENT_NAME" == pull_request_review_comment ]] || exit 1
          [[ "$FORWARDED_EVENT_DELIVERY_ID" =~ ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$ ]] || exit 1
          [[ "$FORWARDED_EVENT_SIGNATURE" =~ ^[0-9a-f]{64}$ && "$REVIEW_EVENT_RELAY_SECRET" =~ ^[0-9a-f]{64}$ ]] || exit 1
          event_bytes="$(printf '%s' "$FORWARDED_EVENT" | wc -c | tr -d ' ')"
          (( event_bytes > 0 && event_bytes <= 60000 )) || exit 1
          [[ "$EXPECTED_DEFAULT_BRANCH" =~ ^[A-Za-z0-9._/-]+$ ]] || exit 1
          jq -e --arg repo "$EXPECTED_REPO" --arg id "$EXPECTED_REPO_ID" \
            --arg pr "$TARGET_PR" --arg base "$EXPECTED_DEFAULT_BRANCH" \
            --arg matic "ProspectOre/matic-home-assistant" --arg maintenance "release/0.4" \
            --arg event "$FORWARDED_EVENT_NAME" '
              def sha: type == "string" and test("^[0-9a-f]{40}$");
              def actor: type == "object" and (.id | type == "number" and . > 0)
                and (.login | type == "string" and length > 0)
                and (.type == "User" or .type == "Bot");
              type == "object" and .schema_version == 1
              and .repository.full_name == $repo and (.repository.id | tostring) == $id
              and (.pull_request.number | tostring) == $pr
              and (.pull_request.base.ref == $base
                or ($repo == $matic and .pull_request.base.ref == $maintenance))
              and (.pull_request.head.sha | sha) and (.pull_request.base.sha | sha)
              and .event_name == $event
              and ((if $event == "pull_request_review" then
                (.action == "submitted" or .action == "edited" or .action == "dismissed")
                and (.review.id | type == "number" and . > 0)
                and (.review.user | actor) and (.review.commit_id | sha)
                and (.review.body == null or (.review.body | type == "string"))
                and (.review.submitted_at | type == "string")
              else
                (.action == "created" or .action == "edited" or .action == "deleted")
                and (.comment.id | type == "number" and . > 0)
                and (.comment.user | actor) and (.comment.original_commit_id | sha)
                and (.comment.pull_request_review_id | type == "number" and . > 0)
                and (.comment.body == null or (.comment.body | type == "string"))
                and (.comment.updated_at | type == "string")
              end) and (.action != "edited" or (.changes.body.from | type == "string")))' \
            <<< "$FORWARDED_EVENT" >/dev/null
          python3 - <<'PY'
          import hashlib, hmac, json, os, re
          name = os.environ['FORWARDED_EVENT_NAME']
          delivery = os.environ['FORWARDED_EVENT_DELIVERY_ID'].lower()
          capture = os.environ['REVIEW_CAPTURE_ID']
          raw = os.environ['FORWARDED_EVENT']
          secret = os.environ['REVIEW_EVENT_RELAY_SECRET']
          signature = os.environ['FORWARDED_EVENT_SIGNATURE']
          if not re.fullmatch(r'[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}', delivery):
              raise SystemExit('invalid relay delivery identity')
          envelope = json.loads(raw)
          if envelope.get('delivery_id') != delivery or envelope.get('event_name') != name \
                  or capture != str(int(delivery.replace('-', ''), 16)):
              raise SystemExit('relay capture identity mismatch')
          message = f'{name}\n{delivery}\n{raw}'.encode('utf-8')
          expected = hmac.new(secret.encode('ascii'), message, hashlib.sha256).hexdigest()
          if not hmac.compare_digest(expected, signature):
              raise SystemExit('relay signature mismatch')
          PY
          event_head="$(jq -er '.pull_request.head.sha' <<< "$FORWARDED_EVENT")"
          history_head="$(jq -er 'if .review? != null then .review.commit_id else .comment.original_commit_id end' <<< "$FORWARDED_EVENT")"
          for attempt in 1 2 3; do
            if gh api "repos/$EXPECTED_REPO/statuses/$event_head" --silent \
              -f state=pending -f context=review-gate \
              -f description="Authenticated review event pending trusted reconciliation" \
              -f target_url="$GITHUB_SERVER_URL/$EXPECTED_REPO/actions/runs/$GITHUB_RUN_ID"; then
              break
            fi
            if [[ "$attempt" == 3 ]]; then
              echo "Unable to publish pending review-gate status on authenticated event head." >&2
              exit 1
            fi
            sleep "$attempt"
          done
          live_head=""
          for attempt in 1 2 3; do
            if pr_snapshot="$(gh api "repos/$EXPECTED_REPO/pulls/$TARGET_PR")" \
                && live_head="$(jq -er '.head.sha | select(type == "string" and test("^[0-9a-f]{40}$"))' <<< "$pr_snapshot")" \
                && [[ "$live_head" =~ ^[0-9a-f]{40}$ ]]; then
              break
            fi
            live_head=""
            if [[ "$attempt" == 3 ]]; then
              echo "Unable to discover a valid live PR head after three attempts." >&2
              exit 1
            fi
            sleep "$attempt"
          done
          for attempt in 1 2 3; do
            if gh api "repos/$EXPECTED_REPO/statuses/$live_head" --silent \
              -f state=pending -f context=review-gate \
              -f description="Live PR head discovered; trusted reconciliation pending" \
              -f target_url="$GITHUB_SERVER_URL/$EXPECTED_REPO/actions/runs/$GITHUB_RUN_ID"; then
              break
            fi
            if [[ "$attempt" == 3 ]]; then
              echo "Unable to publish pending review-gate status on discovered live head." >&2
              exit 1
            fi
            sleep "$attempt"
          done
          commit_associated_with_pr() {
            local target_sha="$1" associated history
            [[ "$target_sha" =~ ^[0-9a-f]{40}$ ]] || return 1
            [[ "$target_sha" == "$live_head" ]] && return 0
            associated="$(gh api "repos/$EXPECTED_REPO/commits/$target_sha/pulls?per_page=100" --paginate --slurp \
              | jq -er --arg repo "$EXPECTED_REPO" --argjson pr "$TARGET_PR" '
                  if type != "array" or any(.[]; type != "array") then
                    error("Invalid commit-associated PR pages")
                  elif any(.[][]; .number == $pr and .base.repo.full_name == $repo) then "associated"
                  elif ([.[][]] | length) == 0 then "empty"
                  else "foreign" end')" || return 1
            [[ "$associated" != associated ]] || return 0
            [[ "$associated" == empty || "$associated" == foreign ]] || return 1
            # Immutable force-push refs can outlive the commit-to-PR association.
            # GraphQL variables are evaluated by the server.
            # shellcheck disable=SC2016
            history="$(gh api graphql --paginate --slurp \
              -f owner="${EXPECTED_REPO%%/*}" -f name="${EXPECTED_REPO#*/}" -F pr="$TARGET_PR" \
              -f query='query($owner:String!, $name:String!, $pr:Int!, $endCursor:String) {
                repository(owner:$owner,name:$name) { nameWithOwner pullRequest(number:$pr) {
                  number timelineItems(first:100,after:$endCursor,itemTypes:[HEAD_REF_FORCE_PUSHED_EVENT]) {
                    nodes { __typename ... on HeadRefForcePushedEvent { beforeCommit { oid } afterCommit { oid } } }
                    pageInfo { hasNextPage endCursor }
                  }
                } }
              }')" || return 1
            jq -e --arg repo "$EXPECTED_REPO" --argjson pr "$TARGET_PR" --arg sha "$target_sha" '
              if type != "array" or length == 0 then error("Missing force-push history") else
                if any(.[]; ((.errors // []) | length) != 0
                    or .data.repository.nameWithOwner != $repo
                    or .data.repository.pullRequest.number != $pr) then error("Foreign force-push history") else
                  [.[] | .data.repository.pullRequest.timelineItems] as $pages
                  | if any($pages[]; (.nodes | type) != "array"
                      or (.pageInfo.hasNextPage | type) != "boolean"
                      or (.pageInfo.hasNextPage and ((.pageInfo.endCursor | type) != "string"))
                      or any(.nodes[]; .__typename != "HeadRefForcePushedEvent"
                        or ((.beforeCommit.oid | type) != "string") or ((.afterCommit.oid | type) != "string")
                        or ((.beforeCommit.oid | test("^[0-9a-f]{40}$")) | not)
                        or ((.afterCommit.oid | test("^[0-9a-f]{40}$")) | not)))
                    or $pages[-1].pageInfo.hasNextPage != false
                    or any($pages[:-1][]; .pageInfo.hasNextPage != true)
                    or (([$pages[] | select(.pageInfo.hasNextPage) | .pageInfo.endCursor] | unique | length)
                      != ([$pages[] | select(.pageInfo.hasNextPage)] | length))
                    then error("Incomplete or invalid force-push history")
                    else any($pages[].nodes[]; .beforeCommit.oid == $sha or .afterCommit.oid == $sha) end
                end
              end' <<< "$history" >/dev/null
          }
          commit_associated_with_pr "$event_head" || {
            echo "Signed relay event head is not associated with PR #$TARGET_PR." >&2
            exit 1
          }
          commit_associated_with_pr "$history_head" || {
            echo "Signed relay history head is not associated with PR #$TARGET_PR." >&2
            exit 1
          }
          expected_pending="Review event $(jq -r '.action' <<< "$FORWARDED_EVENT") for PR #$TARGET_PR"
          receipt_heads=("$event_head")
          if [[ "$history_head" != "$event_head" ]]; then receipt_heads+=("$history_head"); fi
          for receipt_head in "${receipt_heads[@]}"; do
            receipt="$(gh api "repos/$EXPECTED_REPO/commits/$receipt_head/statuses?per_page=100" --paginate --slurp \
              | jq -c --arg context "review-event-capture/$REVIEW_CAPTURE_ID" \
                '[.[][] | select(.context == $context)][0] // null')"
            jq -e --arg pending "$expected_pending" \
              --arg consumed "Review event capture consumed for PR #$TARGET_PR" \
              '(.state == "pending" and .description == $pending)
               or (.state == "success" and .description == $consumed)' <<< "$receipt" >/dev/null
          done
          event_path="$(mktemp "$RUNNER_TEMP/review-event.XXXXXX")"
          printf '%s' "$FORWARDED_EVENT" > "$event_path"
          chmod 400 "$event_path"
          printf 'pr=%s\nevent_path=%s\ncapture_id=%s\nhead=%s\nhistory_head=%s\n' \
            "$TARGET_PR" "$event_path" "$REVIEW_CAPTURE_ID" "$event_head" "$history_head" >> "$GITHUB_OUTPUT"
      - id: canonical
        name: Load pinned canonical review policy
        env:
          AUDIT_MODE: ${{ github.event_name == 'schedule' || inputs.audit == true }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          POLICY_REF: ${{ github.workflow_sha }}
          PR_NUMBER: ${{ inputs.pull_request || github.event.pull_request.number || github.event.issue.number || github.event.workflow_run.pull_requests[0].number }}
          EVENT_PR_NUMBER: ${{ steps.signal-relay-event.outputs.pr || github.event.pull_request.number || github.event.issue.number }}
          EVENT_HEAD_SHA: ${{ steps.signal-relay-event.outputs.head || steps.begin-native-event.outputs.head || github.event.pull_request.head.sha }}
          HISTORY_HEAD_SHA: ${{ steps.signal-relay-event.outputs.history_head || steps.begin-native-event.outputs.head }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          EXPECTED_SHA256: '92c86bc6e0811c872627ea7e9aa0b7ef505722e5cff22d37692e01310c49c809'
          EXPECTED_DEPENDENCY_SHA256: '3dfc642b88404487cd5a7cb91c60ab054067f617b867813a5bacb0c80a701455'
          EXPECTED_REVIEW_SECTIONS_SHA256: '27a45240800c41400e7e82cd0a8b453377f6f9b3b02f49eb27a6e16cc45a598b'
          EXPECTED_ISSUE_COMMENT_RECEIPTS_SHA256: 'eecfa47a7879df2aa4415fb6bb2487292f0af924018312bdf8d7ee1fbf9b72ec'
        shell: bash
        run: |
          set -euo pipefail
          export PATH="/opt/homebrew/bin:/usr/local/bin:$PATH"
          [[ "$GITHUB_WORKFLOW_REF" == "$REPO/.github/workflows/"*"@refs/heads/$DEFAULT_BRANCH" ]] || exit 1
          [[ "$POLICY_REF" =~ ^[0-9a-f]{40}$ && "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]] || exit 1
          write_pending_status() {
            local target_head="$1" description="$2" attempt
            for attempt in 1 2 3; do
              if gh api "repos/$REPO/statuses/$target_head" --silent -f state=pending \
                -f context=review-gate -f description="$description" \
                -f target_url="$GITHUB_SERVER_URL/$REPO/actions/runs/$GITHUB_RUN_ID"; then
                return 0
              fi
              if [[ "$attempt" == 3 ]]; then return 1; fi
              sleep "$attempt"
            done
          }
          # Revoke the authenticated event head before the first fallible PR
          # lookup. The event payload (or signed relay output) binds this SHA
          # to PR_NUMBER; membership is checked after the safety barrier.
          if [[ "${AUDIT_MODE:-false}" != true && "${EVENT_PR_NUMBER:-}" == "$PR_NUMBER" \
                && "${EVENT_HEAD_SHA:-}" =~ ^[0-9a-f]{40}$ ]]; then
            write_pending_status "$EVENT_HEAD_SHA" 'Loading canonical review policy'
          fi
          pr_head=""
          for attempt in 1 2 3; do
            if pr="$(gh api "repos/$REPO/pulls/$PR_NUMBER")" \
                && jq -e '.state == "open" or .state == "closed"' <<< "$pr" >/dev/null \
                && pr_head="$(jq -er '.head.sha | select(type == "string" and test("^[0-9a-f]{40}$"))' <<< "$pr")" \
                && [[ "$pr_head" =~ ^[0-9a-f]{40}$ ]]; then
              break
            fi
            pr_head=""
            if [[ "$attempt" == 3 ]]; then
              echo "Unable to discover a valid live PR snapshot after three attempts." >&2
              exit 1
            fi
            sleep "$attempt"
          done
          # Revoke the live PR head before any secondary membership reads.
          if [[ "${AUDIT_MODE:-false}" != true && "$(jq -r '.state' <<< "$pr")" == open \
                && ( "${EVENT_PR_NUMBER:-}" != "$PR_NUMBER" || "$pr_head" != "${EVENT_HEAD_SHA:-}" ) ]]; then
            write_pending_status "$pr_head" 'Loading canonical review policy'
          fi
          commit_associated_with_pr() {
            local target_sha="$1" associated history
            [[ "$target_sha" =~ ^[0-9a-f]{40}$ ]] || return 1
            [[ "$target_sha" == "$pr_head" ]] && return 0
            associated="$(gh api "repos/$REPO/commits/$target_sha/pulls?per_page=100" --paginate --slurp \
              | jq -er --arg repo "$REPO" --argjson pr "$PR_NUMBER" '
                  if type != "array" or any(.[]; type != "array") then
                    error("Invalid commit-associated PR pages")
                  elif any(.[][]; .number == $pr and .base.repo.full_name == $repo) then "associated"
                  elif ([.[][]] | length) == 0 then "empty"
                  else "foreign" end')" || return 1
            [[ "$associated" != associated ]] || return 0
            [[ "$associated" == empty || "$associated" == foreign ]] || return 1
            # Immutable force-push refs can outlive the commit-to-PR association.
            # GraphQL variables are evaluated by the server.
            # shellcheck disable=SC2016
            history="$(gh api graphql --paginate --slurp \
              -f owner="${REPO%%/*}" -f name="${REPO#*/}" -F pr="$PR_NUMBER" \
              -f query='query($owner:String!, $name:String!, $pr:Int!, $endCursor:String) {
                repository(owner:$owner,name:$name) { nameWithOwner pullRequest(number:$pr) {
                  number timelineItems(first:100,after:$endCursor,itemTypes:[HEAD_REF_FORCE_PUSHED_EVENT]) {
                    nodes { __typename ... on HeadRefForcePushedEvent { beforeCommit { oid } afterCommit { oid } } }
                    pageInfo { hasNextPage endCursor }
                  }
                } }
              }')" || return 1
            jq -e --arg repo "$REPO" --argjson pr "$PR_NUMBER" --arg sha "$target_sha" '
              if type != "array" or length == 0 then error("Missing force-push history") else
                if any(.[]; ((.errors // []) | length) != 0
                    or .data.repository.nameWithOwner != $repo
                    or .data.repository.pullRequest.number != $pr) then error("Foreign force-push history") else
                  [.[] | .data.repository.pullRequest.timelineItems] as $pages
                  | if any($pages[]; (.nodes | type) != "array"
                      or (.pageInfo.hasNextPage | type) != "boolean"
                      or (.pageInfo.hasNextPage and ((.pageInfo.endCursor | type) != "string"))
                      or any(.nodes[]; .__typename != "HeadRefForcePushedEvent"
                        or ((.beforeCommit.oid | type) != "string") or ((.afterCommit.oid | type) != "string")
                        or ((.beforeCommit.oid | test("^[0-9a-f]{40}$")) | not)
                        or ((.afterCommit.oid | test("^[0-9a-f]{40}$")) | not)))
                    or $pages[-1].pageInfo.hasNextPage != false
                    or any($pages[:-1][]; .pageInfo.hasNextPage != true)
                    or (([$pages[] | select(.pageInfo.hasNextPage) | .pageInfo.endCursor] | unique | length)
                      != ([$pages[] | select(.pageInfo.hasNextPage)] | length))
                    then error("Incomplete or invalid force-push history")
                    else any($pages[].nodes[]; .beforeCommit.oid == $sha or .afterCommit.oid == $sha) end
                end
              end' <<< "$history" >/dev/null
          }
          if [[ "${AUDIT_MODE:-false}" != true && "${EVENT_PR_NUMBER:-}" == "$PR_NUMBER" \
                && "${EVENT_HEAD_SHA:-}" =~ ^[0-9a-f]{40}$ ]] \
                && ! commit_associated_with_pr "$EVENT_HEAD_SHA"; then
            echo "Authenticated event head is not associated with PR #$PR_NUMBER." >&2
            exit 1
          fi
          resolve_associated_commit_ref() {
            local target_ref="$1" resolved
            [[ "$target_ref" =~ ^[0-9a-f]{10}([0-9a-f]{30})?$ ]] || return 1
            resolved="$(gh api "repos/$REPO/commits/$target_ref" --jq '.sha')" || return 1
            [[ "$resolved" =~ ^[0-9a-f]{40}$ && "$resolved" == "$target_ref"* ]] || return 1
            commit_associated_with_pr "$resolved" || return 1
            printf '%s\n' "$resolved"
          }
          if [[ "${AUDIT_MODE:-false}" != true && "${HISTORY_HEAD_SHA:-}" =~ ^[0-9a-f]{40}$ \
                && "$HISTORY_HEAD_SHA" != "${EVENT_HEAD_SHA:-}" ]] \
                && commit_associated_with_pr "$HISTORY_HEAD_SHA"; then
            gh api "repos/$REPO/statuses/$HISTORY_HEAD_SHA" --silent -f state=pending \
              -f context=review-gate -f description='Relayed review event pending history reconciliation' \
              -f target_url="$GITHUB_SERVER_URL/$REPO/actions/runs/$GITHUB_RUN_ID"
          fi
          # Authenticated review comments carry their reviewed commit even
          # though issue_comment payloads have no pull_request.head object.
          # GitHub resolves a unique abbreviated SHA in this status write;
          # ambiguous/invalid refs fail rather than preserving stale success.
          if [[ "${AUDIT_MODE:-false}" != true && -f "${GITHUB_EVENT_PATH:-}" ]]; then
            comment_heads="$(jq -r --arg pr "$PR_NUMBER" '
              def coordinator_head:
                select(test("(?is)\\A[[:space:]]*@codex review[ \\t]*\\r?\\n[[:space:]]*(?:Review current head \\x60[0-9a-f]{40}\\x60\\.(?: Report concrete correctness, security, and regression defects with their triggering conditions\\. Assess related cases together; omit style-only preferences\\.)?[ \\t]*\\r?\\n[[:space:]]*)?<!--[[:space:]]*review-request:v2[[:space:]]+head=[0-9a-f]{40}[[:space:]]+base=[0-9a-f]{40}[[:space:]]*-->[[:space:]]*(?:\\r?\\n|$)"))
                | capture("<!--[[:space:]]*review-request:v2[[:space:]]+head=(?<head>[0-9a-f]{40})[[:space:]]+base=[0-9a-f]{40}[[:space:]]*-->").head;
              select(.issue.pull_request != null and (.issue.number | tostring) == $pr)
              | select(.comment.user.login == "chatgpt-codex-connector[bot]" and .comment.user.id == 199175422 and .comment.user.type == "Bot")
              | [.comment.body // "", .changes.body.from // ""]
              | [.[] | ((scan("(?i)reviewed commit:[*]*[ \t]*`([0-9a-f]{40}|[0-9a-f]{10})`") | .[0] | ascii_downcase), coordinator_head)] | unique[]' "$GITHUB_EVENT_PATH")"
            while IFS= read -r comment_head; do
              [[ -n "$comment_head" ]] || continue
              resolved_comment_head="$(resolve_associated_commit_ref "$comment_head")" || continue
              gh api "repos/$REPO/statuses/$resolved_comment_head" --silent -f state=pending \
                -f context=review-gate -f description='Review comment changed; loading canonical policy' \
                -f target_url="$GITHUB_SERVER_URL/$REPO/actions/runs/$GITHUB_RUN_ID"
            done <<< "$comment_heads"
          fi
          policy="$(mktemp "$RUNNER_TEMP/review-policy.XXXXXX")"
          trap 'rm -f "$policy" "$policy.dependencies.py" "$policy.review-sections.py" "$policy.issue-comment-receipts.py"' EXIT
          gh api -H 'Accept: application/vnd.github.raw+json' \
            "repos/$REPO/contents/.github/review-gate/evaluate.sh?ref=$POLICY_REF" > "$policy"
          gh api -H 'Accept: application/vnd.github.raw+json' \
            "repos/$REPO/contents/.github/review-gate/classify_dependencies.py?ref=$POLICY_REF" > "$policy.dependencies.py"
          sections_path="$policy.review-sections.py"
          gh api -H 'Accept: application/vnd.github.raw+json' \
            "repos/$REPO/contents/.github/review-gate/review_sections.py?ref=$POLICY_REF" > "$sections_path"
          actual="$(shasum -a 256 "$policy")"
          [[ "${actual%% *}" == "$EXPECTED_SHA256" ]] || exit 1
          actual="$(shasum -a 256 "$policy.dependencies.py")"
          [[ "${actual%% *}" == "$EXPECTED_DEPENDENCY_SHA256" ]] || exit 1
          actual="$(shasum -a 256 "$sections_path")"
          [[ "${actual%% *}" == "$EXPECTED_REVIEW_SECTIONS_SHA256" ]] || exit 1
          chmod 400 "$sections_path"
          receipt_path=""
          if [[ -n "$EXPECTED_ISSUE_COMMENT_RECEIPTS_SHA256" ]]; then
            receipt_path="$policy.issue-comment-receipts.py"
            gh api -H 'Accept: application/vnd.github.raw+json' \
              "repos/$REPO/contents/.github/review-gate/issue_comment_receipts.py?ref=$POLICY_REF" > "$receipt_path"
            actual="$(shasum -a 256 "$receipt_path")"
            [[ "${actual%% *}" == "$EXPECTED_ISSUE_COMMENT_RECEIPTS_SHA256" ]] || exit 1
            chmod 400 "$receipt_path"
          fi
          chmod 400 "$policy" "$policy.dependencies.py"
          {
            echo "path=$policy"
            echo "sections_path=$sections_path"
            echo "receipt_path=$receipt_path"
          } >> "$GITHUB_OUTPUT"
          trap - EXIT
      - name: Evaluate exact-head regular review
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ github.token }}
          INPUT_PR: ${{ inputs.pull_request }}
          EVENT_PR_NUMBER: ${{ steps.signal-relay-event.outputs.pr || github.event.pull_request.number || github.event.issue.number }}
          EVENT_NAME: ${{ inputs.review_event_name || github.event_name }}
          EVENT_ACTION: ${{ github.event.action }}
          FORWARDED_EVENT_PATH: ${{ steps.signal-relay-event.outputs.event_path }}
          REVIEW_CAPTURE_ID: ${{ steps.signal-relay-event.outputs.capture_id }}
          REVIEW_CAPTURE_HEAD_SHA: ${{ steps.signal-relay-event.outputs.head }}
          REVIEW_CAPTURE_HISTORY_HEAD_SHA: ${{ steps.signal-relay-event.outputs.history_head }}
          EVENT_HEAD_SHA: ${{ steps.signal-relay-event.outputs.history_head || steps.signal-relay-event.outputs.head || steps.begin-native-event.outputs.head || github.event.pull_request.head.sha }}
          HISTORICAL_NATIVE_EVENT: ${{ steps.begin-native-event.outputs.historical }}
          RECORD_EVENT_ONLY: ${{ steps.signal-relay-event.outputs.capture_id != '' || steps.begin-native-event.outputs.historical == 'true' }}
          AUDIT_MODE: ${{ inputs.audit == true }}
          REPO: ${{ github.repository }}
          REVIEW_NATIVE_EVENT_ID: ${{ steps.begin-native-event.outputs.id }}
          ISSUE_COMMENT_RECEIPTS_SCRIPT: ${{ steps.canonical.outputs.receipt_path }}
          REQUIRE_CLEAN_ISSUE_COMMENT_RECEIPT: "true"
          REVIEW_GATE_WORKFLOW_FILE: review-gate.yml
          REVIEW_EVENT_SENSOR_WORKFLOW_FILE: review-gate.yml
          REVIEW_EVENT_RECEIVER_WORKFLOW_FILE: review-gate-capture-completion.yml
          REVIEW_BOT: chatgpt-codex-connector[bot]
          REVIEW_BOT_LOGIN: chatgpt-codex-connector
          REVIEW_BOT_EVENT_LOGIN: chatgpt-codex-connector[bot]
          REVIEW_GATE_CONTEXT: review-gate
          REVIEW_ROLLOUT_CONTEXT: review-gate-rollout
          REVIEW_BASE_CONTEXT: review-gate-base-change
          REVIEW_COMMENT_CONTEXT: review-gate-regular-comment
          REVIEW_REVIEW_CONTEXT: review-gate-regular-review
          REVIEW_SECTIONS_SCRIPT: ${{ steps.canonical.outputs.sections_path }}
          CANONICAL_REVIEW_GATE: ${{ steps.canonical.outputs.path }}
          SECURITY_REVIEW_BOT_LOGIN: chatgpt-codex-connector
          SECURITY_REVIEW_BOT_EVENT_LOGIN: chatgpt-codex-connector[bot]
        shell: bash
        run: |
          set -euo pipefail
          unset REVIEW_HEAD_OBSERVED_AT
          if [[ -n "$FORWARDED_EVENT_PATH" ]]; then export GITHUB_EVENT_PATH="$FORWARDED_EVENT_PATH"; fi
          bash "$CANONICAL_REVIEW_GATE"
          if [[ -n "$REVIEW_CAPTURE_ID" ]]; then
            [[ "$REVIEW_CAPTURE_ID" =~ ^[1-9][0-9]*$ && "$REVIEW_CAPTURE_HEAD_SHA" =~ ^[0-9a-f]{40}$ && "$REVIEW_CAPTURE_HISTORY_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]] || exit 1
            # The separate completion consumer writes receipts only after this run succeeds.
          elif [[ "$HISTORICAL_NATIVE_EVENT" == true ]]; then
            for attempt in 1 2 3; do
              if gh workflow run review-gate.yml --repo "$REPO" --ref "$DEFAULT_BRANCH" \
                -f pull_request="$EVENT_PR_NUMBER" -F audit=true; then
                break
              fi
              [[ "$attempt" == 3 ]] && exit 1
              sleep "$attempt"
            done
          fi
      - name: Remove canonical policy temporary file
        if: always()
        env:
          FORWARDED_EVENT_PATH: ${{ steps.signal-relay-event.outputs.event_path }}
          POLICY_PATH: ${{ steps.canonical.outputs.path }}
          RECEIPT_PATH: ${{ steps.canonical.outputs.receipt_path }}
        shell: bash
        run: |
          if [[ -n "$POLICY_PATH" ]]; then rm -f -- "$POLICY_PATH" "$POLICY_PATH.dependencies.py" "$POLICY_PATH.review-sections.py"; fi
          if [[ -n "$RECEIPT_PATH" ]]; then rm -f -- "$RECEIPT_PATH"; fi
          if [[ -n "$FORWARDED_EVENT_PATH" ]]; then rm -f -- "$FORWARDED_EVENT_PATH"; fi
