name: Feature request
description: Suggest a Home Assistant feature for Matic.
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    attributes:
      label: What would you like to do?
      description: Describe the task or automation this would help with.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Related robot or app behavior
      description: If Matic already does something similar, describe it here.
  - type: checkboxes
    attributes:
      label: Privacy
      options:
        - label: I removed private home data and credentials.
          required: true
