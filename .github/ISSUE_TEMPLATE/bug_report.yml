name: Bug report
description: Report a problem with the Matic integration.
title: "[Bug]: "
labels: [bug]
body:
  - type: checkboxes
    attributes:
      label: Privacy
      options:
        - label: I removed credentials and private home data, and have not attached raw storage, backups, maps, or captures.
          required: true
  - type: input
    attributes:
      label: Integration version
      placeholder: 0.4.0
    validations:
      required: true
  - type: input
    attributes:
      label: Home Assistant version and installation
      placeholder: 2026.7.2, Home Assistant OS
    validations:
      required: true
  - type: input
    attributes:
      label: Bluetooth setup (pairing problems only)
      description: Local adapter model, distance to the robot, and other Bluetooth integrations.
  - type: dropdown
    attributes:
      label: Where does it fail?
      options:
        - Discovery
        - Bluetooth pairing
        - Setup or restart
        - State update
        - Map or rooms
        - Vacuum control
        - Other
    validations:
      required: true
  - type: textarea
    attributes:
      label: What happened?
      description: Include steps to reproduce, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Relevant logs or diagnostics
      description: >-
        Paste the Matic entries from Settings → System → Logs. For more detail,
        enable debug logging on the integration, reproduce the problem, then
        disable it. Review all attachments for private information.
