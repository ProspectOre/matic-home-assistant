[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "matic-home-assistant"
version = "0.6.0b1"
description = "Unofficial local-only Home Assistant integration for Matic robot vacuums"
readme = "README.md"
license = "MIT"
requires-python = ">=3.14.2"
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.14",
]
dependencies = [
  "cryptography>=44",
  "grpclib==0.4.9",
  "h2>=4",
  "Pillow>=11",
  "numpy>=2.3.2",
  "protobuf>=6",
]

[project.optional-dependencies]
test = [
  "dbus-fast>=1.83.0",
  "gazetteer-matcher==1.1.0",
  "hassil==3.12.1",
  "home-assistant-intents==2026.10.6",
  "mypy>=1.16",
  "PyTurboJPEG==1.8.3",
  "pytest>=8",
  "pytest-asyncio>=0.25",
  "pytest-cov>=6",
  "pytest-homeassistant-custom-component==0.13.375",
  "ruff>=0.12",
  "types-protobuf>=6",
]

# uv installs the dev group by default, so `uv run` gets the test extra.
[dependency-groups]
dev = ["matic-home-assistant[test]"]

[project.urls]
Documentation = "https://github.com/ProspectOre/matic-home-assistant#readme"
Issues = "https://github.com/ProspectOre/matic-home-assistant/issues"
Source = "https://github.com/ProspectOre/matic-home-assistant"

[tool.pytest.ini_options]
asyncio_mode = "auto"
faulthandler_timeout = "120"
faulthandler_exit_on_timeout = true
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["custom_components*"]

[tool.coverage.run]
branch = true
omit = ["custom_components/matic_robot/client/proto/*"]

[tool.coverage.report]
show_missing = true

[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.per-file-target-version]
"tests/windows/nvda_speech_probe.py" = "py313"

[tool.ruff.lint]
select = [
  "ASYNC",
  "B",
  "C4",
  "E",
  "F",
  "I",
  "PERF",
  "PIE",
  "RUF",
  "UP",
]

[tool.ruff.lint.per-file-ignores]
"custom_components/matic_robot/client/proto/*" = ["ALL"]
"tests/*" = ["S101"]

[tool.mypy]
strict = true
explicit_package_bases = true
exclude = "custom_components/matic_robot/client/proto/"

[[tool.mypy.overrides]]
module = ["custom_components.matic_robot.client.proto.*"]
follow_imports = "skip"
ignore_errors = true
