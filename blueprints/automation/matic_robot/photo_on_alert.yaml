blueprint:
  name: "Matic: Photo check on alert"
  description: >-
    When a sensor turns on or an alarm goes off, the robot goes to a saved
    viewpoint or a room, takes a photo and docks. Your phone hears about it at
    once, then the same notification shows the photo when it is taken, usually
    within a minute. The photo shows what is there when the robot arrives, not
    a live view of the moment the sensor turned on. Choose an AI Task entity to
    add its answer to a question about the photo; that entity receives the full
    photo and the question, and its provider may be cloud-based. The robot
    starts only from the dock or idle, and not again until the cooldown has
    passed, unless you press Send another on the photo.
  domain: automation
  source_url: https://github.com/ProspectOre/matic-home-assistant/blob/main/blueprints/automation/matic_robot/photo_on_alert.yaml
  input:
    vacuum:
      name: Robot
      description: The robot that takes the photo, for example vacuum.matic.
      selector:
        entity:
          integration: matic_robot
          domain: vacuum
    sensors:
      name: Alert sensors
      description: >-
        Sensors that start a check when they turn on, such as a door, motion or
        water leak sensor, or an alarm panel that goes off.
      selector:
        entity:
          domain: [binary_sensor, alarm_control_panel]
          multiple: true
    viewpoint:
      name: Viewpoint
      description: >-
        A viewpoint saved in Matic Map's Photos, for example Front door. Leave
        empty to use a room instead.
      default: ""
      selector:
        text:
    room:
      name: Room
      description: >-
        Used when no viewpoint is set: a room by its name in Matic Map, where
        the robot picks the spot.
      default: ""
      selector:
        text:
    notify_service:
      name: Notification action
      description: >-
        For example notify.mobile_app_my_phone. Other notification actions,
        such as Telegram or email, get the text without the photo.
      selector:
        text:
    phone_app:
      name: Home Assistant phone app
      description: >-
        Turn off when the notification action is not the Home Assistant phone
        app, which shows the photo and the Send home, Open photo and Send
        another buttons.
      default: true
      selector:
        boolean:
    urgent:
      name: Time-sensitive notifications
      description: >-
        Marks the notifications time sensitive on iPhone and high priority on
        Android so they arrive at once. Whether they sound during a Focus or
        Do Not Disturb depends on the phone's settings for Home Assistant.
      default: false
      selector:
        boolean:
    ai_task_entity_id:
      name: AI Task entity (optional)
      description: >-
        Receives the full photo and your question; its answer becomes the
        caption. Without one, the caption is the place and the time.
      default: ""
      selector:
        entity:
          domain: ai_task
    question:
      name: Question
      description: Asked about the photo when an AI Task entity is chosen.
      default: >-
        Is there a safety problem visible, such as water, smoke or an open door?
      selector:
        text:
          multiline: true
    full_resolution_notification:
      name: Send the full photo
      description: >-
        By default the notification shows a pixelated preview. Choose this only
        when everyone who receives the notification may see the full photo.
      default: false
      selector:
        boolean:
    cooldown:
      name: Cooldown
      description: >-
        How long to wait after a check before another can start. Alerts during
        the cooldown are ignored; Send another on the photo still goes.
      default:
        minutes: 15
      selector:
        duration:

mode: parallel
max: 10
max_exceeded: silent

variables:
  vacuum: !input vacuum
  viewpoint: !input viewpoint
  room: !input room
  notify_service: !input notify_service
  phone_app: !input phone_app
  urgent: !input urgent
  ai_task_entity_id: !input ai_task_entity_id
  question: !input question
  full_resolution_notification: !input full_resolution_notification
  tag: "{{ 'matic_photo_' ~ this.entity_id }}"
  send_home: "{{ 'MATIC_SEND_HOME_' ~ this.entity_id }}"
  send_another: "{{ 'MATIC_SEND_ANOTHER_' ~ this.entity_id }}"
  matic_map: /matic-map
  # One stack on the phone, and a way through Do Not Disturb when chosen.
  phone_data: >-
    {{ dict({'group': 'matic_photo_check', 'url': matic_map,
             'clickAction': matic_map},
            **({'push': {'interruption-level': 'time-sensitive'},
                'priority': 'high', 'ttl': 0} if urgent else {})) }}

triggers:
  - trigger: state
    entity_id: !input sensors
    to: ["on", "triggered"]
    id: alert
  - trigger: event
    event_type: mobile_app_notification_action
    id: send_home
  - trigger: event
    event_type: mobile_app_notification_action
    id: send_another

conditions:
  - condition: or
    conditions:
      # A check runs on its own: while one runs or cools down, alerts wait.
      - "{{ trigger.id == 'alert' and this.attributes.current | default(0) == 0 }}"
      - "{{ trigger.id == 'send_home' and trigger.event.data.action == send_home }}"
      # A person asked to look again, so it goes even during the cooldown.
      - "{{ trigger.id == 'send_another' and trigger.event.data.action == send_another }}"

actions:
  - if: "{{ trigger.id == 'send_home' }}"
    then:
      - action: vacuum.return_to_base
        target:
          entity_id: "{{ vacuum }}"
      - stop: Sent home
  - variables:
      place: "{{ viewpoint | trim or room | trim }}"
      sensor_name: >-
        {{ trigger.to_state.name if trigger.id == 'alert'
           else viewpoint | trim or room | trim }}
      tour_stop: >-
        {{ {'viewpoint': viewpoint | trim} if viewpoint | trim
           else {'room': room | trim} }}
      busy: >-
        {% set state = states(vacuum) %}
        {% if state in ['docked', 'idle'] %}
        {% elif state == 'cleaning' %}Matic is cleaning, so the photo check was skipped.
        {% elif state == 'paused' %}Matic is paused in the middle of a clean.
        {% elif state == 'error' %}Matic needs help, so the photo check was skipped.
        {% elif state in ['unavailable', 'unknown'] %}Matic isn't reachable.
        {% else %}Matic is busy, so the photo check was skipped.
        {% endif %}
  - if: "{{ busy | length > 0 }}"
    then:
      - action: "{{ notify_service }}"
        data:
          title: "{{ sensor_name }}"
          message: "{{ busy }}"
          data: "{{ dict(phone_data, tag=tag) if phone_app else {} }}"
      - if: "{{ trigger.id == 'alert' }}"
        then:
          - delay: !input cooldown
      - stop: Robot busy
  - action: "{{ notify_service }}"
    data:
      title: "{{ sensor_name }}"
      message: Matic is on its way to look.
      data: >-
        {{ dict(phone_data, tag=tag,
                actions=[{'action': send_home, 'title': 'Send home'}])
           if phone_app else {} }}
  - action: matic_robot.run_photo_tour
    target:
      entity_id: "{{ vacuum }}"
    data: >-
      {{ dict({'stops': [tour_stop], 'report_failures': true,
               'full_resolution': full_resolution_notification,
               'skip_cooldown': trigger.id == 'send_another'},
              **({'question': question, 'ai_task_entity_id': ai_task_entity_id}
                 if ai_task_entity_id else {})) }}
    response_variable: tour
    continue_on_error: true
  - variables:
      result: >-
        {{ tour.robots[0]
           if tour is defined and tour.robots | default([]) | length > 0
           else {'photos': []} }}
      photos: "{{ result.photos }}"
      # Short, plain words for the phone; anything else uses the action's own.
      failure: >-
        {% set reason = result.error.reason if result.error is defined else '' %}
        {{ {
          'photo_tour_stopped': 'Photo check stopped.',
          'photo_tour_low_battery': "Matic's battery is too low for a photo check.",
          'photo_tour_battery_unknown': "Matic's battery level is unknown, so it stayed docked.",
          'photo_tour_robot_busy': 'Matic is busy, so the photo check was skipped.',
          'photo_tour_running': 'Matic is already taking photos.',
          'photo_tour_cooldown': "Matic looked recently, so it didn't go again.",
          'photo_tour_schedule_conflict': 'A scheduled clean is due, so Matic stayed docked.',
          'photo_tour_not_opted_in': "Photo checks are off in Matic's settings.",
          'photo_tour_room_blocked': 'Photos are off in ' ~ place ~ '.',
          'photo_tour_no_arrival': "Matic couldn't reach " ~ place ~ '. Is a door closed?',
          'photo_tour_no_photo': "The camera didn't respond in " ~ place ~ '.',
          'photo_tour_unreachable': "Matic isn't reachable.",
          'viewpoint_unknown': 'There is no viewpoint called ' ~ place ~ '.',
          'viewpoint_other_floor': place ~ ' is on another floor.',
        }.get(reason, result.error.message if result.error is defined
                      else "Matic couldn't get a photo of " ~ place ~ '.') }}
  - if: "{{ photos | length == 0 }}"
    then:
      - action: "{{ notify_service }}"
        data:
          title: "{{ sensor_name }}"
          message: "{{ failure }}"
          data: "{{ dict(phone_data, tag=tag) if phone_app else {} }}"
    else:
      # The first photo replaces the notification; a look-around adds the rest
      # to the same stack. Each one opens its photo in Matic Map, and Send
      # another sends the robot to look again.
      - repeat:
          for_each: "{{ photos }}"
          sequence:
            - action: "{{ notify_service }}"
              data:
                title: "{{ sensor_name }}"
                message: >-
                  {{ repeat.item.analysis.summary
                     if repeat.item.analysis is defined
                     else place ~ ', '
                       ~ (as_datetime(repeat.item.captured_at) | as_local)
                         .strftime('%-I:%M %p') }}
                data: >-
                  {{ dict(phone_data,
                          tag=tag if repeat.first else tag ~ '_' ~ repeat.index,
                          image=repeat.item.url,
                          url=repeat.item.map_url,
                          clickAction=repeat.item.map_url,
                          actions=[{'action': 'URI', 'title': 'Open photo',
                                    'uri': repeat.item.map_url},
                                   {'action': send_another,
                                    'title': 'Send another'}])
                     if phone_app else {} }}
  - delay: !input cooldown
