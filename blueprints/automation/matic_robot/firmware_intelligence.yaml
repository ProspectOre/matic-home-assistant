blueprint:
  name: "Matic: Send firmware alerts"
  description: >-
    Sends a phone notification when the robot's firmware checks keep failing,
    when they recover, and when firmware research finds something to act on.
    Notifications let you check again or acknowledge. Notifications that were
    not delivered are sent after Home Assistant restarts. Choose who researches
    firmware separately with the action Advanced: Choose firmware investigator.
  domain: automation
  source_url: https://github.com/ProspectOre/matic-home-assistant/blob/main/blueprints/automation/matic_robot/firmware_intelligence.yaml
  input:
    firmware_sensor:
      name: Firmware check status sensor
      description: >-
        The robot's Firmware check status sensor, for example
        sensor.matic_firmware_compatibility. The robot is found from this
        sensor's device.
      selector:
        entity:
          integration: matic_robot
          domain: sensor
    notify_service:
      name: Mobile notification action
      description: >-
        Your Companion app notification action, for example
        notify.mobile_app_my_phone.
      selector:
        text:
    notification_namespace:
      name: Notification ID prefix
      description: >-
        Use a different value on each Home Assistant server so notifications
        don't replace each other. Default matic_firmware; for example
        matic_firmware_cabin.
      default: matic_firmware
      selector:
        text:

mode: queued
max: 10
variables:
  firmware_sensor: !input firmware_sensor
  robot_device: "{{ device_id(firmware_sensor) }}"
  vacuum_entity: >-
    {{ (device_entities(robot_device) | select('match', 'vacuum\\.') | list
        or [''])[0] if robot_device else '' }}
  namespace: !input notification_namespace
  notify_service: !input notify_service
  notification_key: "{{ namespace ~ '_' ~ vacuum_entity }}"

triggers:
  - trigger: state
    entity_id: !input firmware_sensor
    attribute: firmware_report
    id: report
  - trigger: homeassistant
    event: start
    id: reconcile
  - trigger: time_pattern
    minutes: "/30"
    id: reconcile
  - trigger: event
    event_type: mobile_app_notification_action
    id: mobile

actions:
  - variables:
      report_attribute: "{{ state_attr(firmware_sensor, 'firmware_report') }}"
      report_revision_attribute: "{{ state_attr(firmware_sensor, 'firmware_report_revision') }}"
      report: "{{ report_attribute if report_attribute is mapping else {} }}"
  - condition: template
    value_template: >-
      {{ vacuum_entity is string
         and vacuum_entity.startswith('vacuum.')
         and report_attribute is mapping
         and report.get('id', '') is string
         and (report.get('id', '') | length) == 24
         and (report.get('revision', 0) | int(0)) > 0
         and (report.get('revision', 0) | int(0)) == (report_revision_attribute | int(0)) }}
  - variables:
      acknowledge_action: "{{ 'MATIC_FW_ACK|' ~ notification_key ~ '|' ~ report.id ~ '|' ~ report.revision }}"
      recheck_action: "{{ 'MATIC_FW_CHECK|' ~ notification_key ~ '|' ~ report.id ~ '|' ~ report.revision }}"
      mobile_action: "{{ trigger.event.data.get('action', '') if trigger.get('id', '') == 'mobile' else '' }}"
      research: "{{ report.get('investigation', {}) }}"
      consumed_revision: "{{ [report.get('delivered_revision', 0), report.get('acknowledged_revision', 0)] | max }}"
      research_actionable: >-
        {{ research.get('status') == 'complete'
           and research.get('disposition') in ['integration_opportunity', 'compatibility_issue']
           and consumed_revision < research.get('notification_revision', 0) <= report.revision }}
      actionable_report: >-
        {% set failures = report.get('findings', []) | selectattr('kind', 'eq', 'read_failure')
           | selectattr('notification_revision', 'defined')
           | selectattr('notification_revision', 'gt', consumed_revision)
           | selectattr('notification_revision', 'le', report.revision) | list %}
        {% set confirmed = failures | selectattr('status', 'eq', 'observed_again') | list %}
        {% set recovered = failures | selectattr('status', 'eq', 'recovered')
           | selectattr('observation_count', 'defined') | selectattr('observation_count', 'ge', 2) | list %}
        {{ (confirmed | count) > 0 or (recovered | count) > 0
           or research_actionable }}
  - choose:
      - conditions: "{{ mobile_action == acknowledge_action }}"
        sequence:
          - action: matic_robot.firmware_notification
            target:
              entity_id: "{{ vacuum_entity }}"
            data:
              report_id: "{{ report.id }}"
              revision: "{{ report.revision }}"
              action: acknowledge
          - action: persistent_notification.dismiss
            data:
              notification_id: "{{ notification_key }}"
          - action: "{{ notify_service }}"
            data:
              message: clear_notification
              data:
                tag: "{{ notification_key }}"
      - conditions: "{{ mobile_action == recheck_action }}"
        sequence:
          - action: matic_robot.firmware_notification
            target:
              entity_id: "{{ vacuum_entity }}"
            data:
              report_id: "{{ report.id }}"
              revision: "{{ report.revision }}"
              action: recheck
      - conditions: "{{ trigger.get('id', '') != 'mobile' and report.get('notification_pending', false) and actionable_report }}"
        sequence:
          - variables:
              title: >-
                {% if report.attention_required %}Matic firmware checks need attention
                {% elif research_actionable %}Matic firmware investigation complete
                {% else %}Matic firmware checks recovered{% endif %}
              message: >-
                Firmware {{ report.firmware_version }}.
                {{ report.reachable_endpoints }} of {{ report.endpoint_count }} robot data checks succeeded.
                {% if report.attention_required %}Some checks keep failing; open the details to review them.
                {% elif research_actionable %}A firmware research report is ready for an administrator to review.
                {% else %}The checks are working again.{% endif %}
          - action: persistent_notification.create
            data:
              notification_id: "{{ notification_key }}"
              title: "{{ title | trim }}"
              message: >-
                {{ message }}

                [Open the robot's device page](/config/devices/device/{{ robot_device }})
          - action: "{{ notify_service }}"
            data:
              title: "{{ title | trim }}"
              message: "{{ message | trim | truncate(350, true) }}"
              data:
                tag: "{{ notification_key }}"
                group: "{{ namespace }}"
                url: "{{ 'entityId:' ~ firmware_sensor }}"
                push:
                  interruption-level: "{{ 'active' if report.attention_required else 'passive' }}"
                actions:
                  - action: URI
                    title: View details
                    uri: "{{ 'entityId:' ~ firmware_sensor }}"
                  - action: "{{ recheck_action }}"
                    title: Check again
                  - action: "{{ acknowledge_action }}"
                    title: Acknowledge
          - action: matic_robot.firmware_notification
            target:
              entity_id: "{{ vacuum_entity }}"
            data:
              report_id: "{{ report.id }}"
              revision: "{{ report.revision }}"
              action: delivered
