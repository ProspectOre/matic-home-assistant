blueprint:
  name: "Matic: Clean when everyone leaves"
  description: >-
    Starts a cleaning plan after everyone leaves. Rooms that have waited
    longest are cleaned first, so short trips don't keep cleaning the first
    rooms in the plan. It starts only when the robot is docked or idle, so it
    never replaces a clean already underway. When anyone comes home, it stops
    the plan and sends the robot to its dock; a room that was interrupted stays
    due for next time.
  domain: automation
  source_url: https://github.com/ProspectOre/matic-home-assistant/blob/main/blueprints/automation/matic_robot/clean_when_away.yaml
  input:
    vacuum:
      name: Robot
      description: The robot that cleans, for example vacuum.matic.
      selector:
        entity:
          integration: matic_robot
          domain: vacuum
    household:
      name: Household members
      description: >-
        People who must all be away before cleaning starts. Someone in a named
        zone, such as Work, counts as away.
      selector:
        entity:
          domain: person
          multiple: true
    plan:
      name: Plan
      description: >-
        Name of a plan saved in Matic Map, for example Main floor. Leave empty
        to use the default plan.
      default: ""
      selector:
        text:
    settle_time:
      name: Delay before cleaning
      description: >-
        How long everyone must be away before cleaning starts. Default 5
        minutes; for example 15 minutes if people often step out briefly.
      default:
        minutes: 5
      selector:
        duration:

mode: parallel
max: 2
max_exceeded: silent

trigger_variables:
  household_entities: !input household

# Trigger variables reach only trigger templates; the action's recheck needs
# the household list too.
variables:
  household_entities: !input household
  vacuum_entity: !input vacuum
  plan_name: !input plan

triggers:
  # A member is away unless they are home or their state is unknown, so a
  # named zone such as Work counts as away.
  - trigger: template
    id: everyone_left
    value_template: >-
      {{ expand(household_entities)
         | selectattr('state', 'in', ['home', 'unknown', 'unavailable'])
         | list | count == 0 }}
    for: !input settle_time
  - trigger: state
    id: someone_returned
    entity_id: !input household
    to: home

actions:
  - choose:
      - conditions:
          - condition: trigger
            id: everyone_left
          - condition: template
            value_template: >-
              {{ expand(household_entities)
                 | selectattr('state', 'in', ['home', 'unknown', 'unavailable'])
                 | list | count == 0 }}
          - condition: template
            value_template: "{{ states(vacuum_entity) in ('docked', 'idle') }}"
        sequence:
          - action: matic_robot.intelligent_clean
            target:
              entity_id: !input vacuum
            data: >-
              {{ {'plan': plan_name | trim} if (plan_name or '') | trim else {} }}
      - conditions:
          - condition: trigger
            id: someone_returned
        sequence:
          - action: matic_robot.stop_intelligent_cleaning
            continue_on_error: true
            target:
              entity_id: !input vacuum
