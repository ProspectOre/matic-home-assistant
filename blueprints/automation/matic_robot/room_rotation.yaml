blueprint:
  name: "Matic: Clean on a schedule"
  description: >-
    Starts with the rooms that have waited longest since a successful clean,
    then continues through the saved plan. Rooms that failed, were cancelled,
    or were interrupted stay due. It starts only when the robot is docked or
    idle.
  domain: automation
  source_url: https://github.com/ProspectOre/matic-home-assistant/blob/main/blueprints/automation/matic_robot/room_rotation.yaml
  input:
    vacuum:
      name: Robot
      description: The robot that cleans, for example vacuum.matic.
      selector:
        entity:
          integration: matic_robot
          domain: vacuum
    plan:
      name: Plan
      description: >-
        Name of a plan saved in Matic Map, for example Main floor. Leave empty
        to use the default plan.
      default: ""
      selector:
        text:
    run_time:
      name: Start time
      description: >-
        Time of day to start cleaning. Default 10:00; for example 09:00 once
        everyone has left for work.
      default: "10:00:00"
      selector:
        time:

mode: single

variables:
  plan_name: !input plan

triggers:
  - trigger: time
    at: !input run_time

conditions:
  - condition: state
    entity_id: !input vacuum
    state: [docked, idle]

actions:
  - action: matic_robot.intelligent_clean
    target:
      entity_id: !input vacuum
    data: >-
      {{ {'plan': plan_name | trim} if (plan_name or '') | trim else {} }}
